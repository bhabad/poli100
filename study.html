if (!P.ui || !P.ui.mode) P.ui = {mode: 'core'};
/* 'core' = must-know lines and the questions on them; 'full' adds the slide detail and the lower-priority questions */
const full = () => P.ui.mode === 'full';
const allQ = () => full() ? EVERYQ : EVERYQ.filter(id => !QS[id].detail);
const bqs = b => full() ? b.qs : b.qs.filter(id => !QS[id].detail);
const modeHTML = () => `<div class="seg" role="group" aria-label="How much to study"><button data-mode="core" class="${full() ? '' : 'on'}">Must know · ${EVERYQ.length - DETAIL.size} questions</button><button data-mode="full" class="${full() ? 'on' : ''}">Everything · ${EVERYQ.length}</button></div>`;
let fh = null, saveT = null;
const clock = () => new Date().toLocaleTimeString([], {hour: 'numeric', minute: '2-digit'});
const setMsg = t => { $('#savemsg').textContent = t; };
/* Three places this page can run, and where progress goes in each:
   - the local server (guide/serve.py): mirrored to a file on this computer, no code needed;
   - the synced website (*.vercel.app): mirrored to the site's store once this device has the sync code, so every device shares one copy;
   - anywhere else (a shared copy, a plain file): this browser only, plus Save to file. */
const SERVER = !SANDBOX && /^https?:$/.test(location.protocol) && /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
const CLOUD = !SANDBOX && /\.vercel\.app$/.test(location.hostname);
const CODEKEY = 'poli100-sync-code';
const tidy = c => String(c || '').trim().toUpperCase().replace(/[^A-Z0-9-]/g, '');
let code = ''; try { code = localStorage.getItem(CODEKEY) || ''; } catch (e) {}
if (CLOUD) { const m = location.hash.match(/^#sync=([\w-]+)$/); if (m) { code = tidy(m[1]); try { localStorage.setItem(CODEKEY, code); } catch (e) {} history.replaceState(null, '', location.pathname); } }
const syncing = () => SERVER || (CLOUD && !!code);
const hdr = () => CLOUD ? {'x-sync-code': code} : {};
const OFFMSG = () => CLOUD ? 'Offline. Saved in this browser; it will sync when the connection is back.' : 'Auto-save is off (local server stopped). Still saved in this browser.';
const OKMSG = () => (CLOUD ? 'Synced · ' : 'Auto-saved · ') + clock();
let dirty = false, pushT = null, synced = 0;   // synced = the `saved` stamp of the stored copy this window last loaded or wrote
function persist() {
  P.saved = Date.now();
  try { localStorage.setItem(KEY, JSON.stringify(P)); } catch (e) {}
  if (syncing()) { dirty = true; clearTimeout(pushT); pushT = setTimeout(push, CLOUD ? 1200 : 300); }
  else if (fh) { clearTimeout(saveT); saveT = setTimeout(writeFile, 500); }
}
function adopt(j, msg) {
  P = Object.assign(blank(), j); if (!P.ui || !P.ui.mode) P.ui = {mode: 'core'};
  try { localStorage.setItem(KEY, JSON.stringify(P)); } catch (e) {}
  synced = j.saved || 0; dirty = false; $('#save').hidden = true; setMsg(msg); route();
}
function badCode() {
  code = ''; try { localStorage.removeItem(CODEKEY); } catch (e) {}
  dirty = false; $('#save').hidden = false; linkUI(); setMsg('That sync code was not accepted. Progress is saved in this browser only.');
}
async function push() {
  if (!dirty || !syncing()) return; dirty = false;
  try {
    // If another window or device saved after this one last synced, this copy is stale: take the newer one instead of overwriting it.
    const g = await fetch('api/progress', {headers: hdr(), cache: 'no-store'});
    if (g.status === 401) return badCode();
    const cur = g.ok ? await g.json() : {};
    if (cur && typeof cur.q === 'object' && (cur.saved || 0) > synced) return adopt(cur, 'This window was out of date. Loaded your latest progress.');
    const r = await fetch('api/progress', {method: 'POST', headers: Object.assign({'Content-Type': 'application/json'}, hdr()), body: JSON.stringify(P), keepalive: true});
    if (r.status === 401) return badCode();
    if (!r.ok) throw 0;
    synced = P.saved; $('#save').hidden = true; setMsg(OKMSG());
  } catch (e) {
    dirty = true; $('#save').hidden = false; setMsg(OFFMSG());
    clearTimeout(pushT); pushT = setTimeout(push, 8000);
  }
}
async function pull() {
  if (!syncing()) return;
  try {
    const r = await fetch('api/progress', {headers: hdr(), cache: 'no-store'});
    if (r.status === 401) return badCode();
    const j = r.ok ? await r.json() : null;
    if (j && typeof j.q === 'object' && (j.saved || 0) > (P.saved || 0)) return adopt(j, CLOUD ? 'Synced · picked up where you left off' : 'Auto-save on · picked up where you left off');
    synced = (j && j.saved) || 0; dirty = true; push();
  } catch (e) { setMsg(OFFMSG()); }
}
function linkUI() {
  const b = $('#link'); b.hidden = !CLOUD; if (!CLOUD) return;
  b.textContent = code ? 'Add another device' : 'Turn on sync';
  b.onclick = () => {
    if (code) return void prompt('On the other device, open this site, click “Turn on sync”, and type this code:', code);
    const c = tidy(prompt('Enter your sync code'));
    if (!c) return;
    code = c; try { localStorage.setItem(CODEKEY, code); } catch (e) {}
    linkUI(); setMsg('Checking the code…'); pull();
  };
}
document.addEventListener('visibilitychange', () => { if (document.hidden && dirty) { clearTimeout(pushT); push(); } });
async function writeFile() {
  try { const w = await fh.createWritable(); await w.write(JSON.stringify(P, null, 1)); await w.close(); setMsg('Saved to ' + fh.name + ' · ' + clock()); }
  catch (e) { fh = null; setMsg('Auto-save stopped. Click Save to file again.'); }
}
function download() {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(P, null, 1)], {type: 'application/json'}));
  a.download = 'poli100-study-progress.json'; a.click(); setMsg('Downloaded · ' + clock());
}
$('#save').onclick = async () => {
  if (!window.showSaveFilePicker) return download();
  try { fh = await showSaveFilePicker({suggestedName: 'poli100-study-progress.json', types: [{description: 'Study progress', accept: {'application/json': ['.json']}}]}); await writeFile(); }
  catch (e) { if (e.name !== 'AbortError') download(); }
};
$('#load').onclick = () => $('#file').click();
$('#file').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const j = JSON.parse(await f.text());
    if (!j || typeof j.q !== 'object') throw 0;
    if (Object.keys(P.q).length && !confirm('Replace what is in this browser with the file you picked?')) return;
    P = Object.assign(blank(), j); if (!P.ui || !P.ui.mode) P.ui = {mode: 'core'}; synced = Infinity; persist(); setMsg('Loaded ' + f.name); route();
  } catch (err) { setMsg('That file is not a study progress file.'); }
  e.target.value = '';
};

/* ---------- helpers ---------- */
const gradeOf = id => (P.q[id] || {}).g;
const tally = ids => { const c = {g: 0, p: 0, m: 0, n: 0}; ids.forEach(id => c[gradeOf(id) || 'n']++); return c; };
const meter = (c, t) => `<div class="meter" role="img" aria-label="${c.g} got, ${c.p} partly, ${c.m} missed, ${c.n} not tried">${['g','p','m'].map(k => `<i class="${k}" style="width:${100 * c[k] / t}%"></i>`).join('')}</div>`;
const dayNum = t => Math.floor((t - new Date(t).getTimezoneOffset() * 6e4) / 864e5);
const ago = t => { if (!t) return ''; const d = dayNum(Date.now()) - dayNum(t); return d <= 0 ? 'today' : d === 1 ? 'yesterday' : d + ' days ago'; };
const ordinal = n => n + (n % 100 > 10 && n % 100 < 14 ? 'th' : ['th', 'st', 'nd', 'rd'][n % 10] || 'th');
const modelText = q => q.k === 'open' ? md(q.a) : q.k === 'fill' ? '<b>' + esc(q.a[0]) + '</b>' : q.k === 'tf' ? (q.a ? 'True. ' : 'False. ') + md(q.why || '')
  : q.k === 'order' ? q.items.map(md).join(' → ')
  : q.k === 'sort' ? q.buckets.map((b, bi) => '<b>' + md(b) + ':</b> ' + q.items.filter(x => x[1] === bi).map(x => md(x[0])).join('; ')).join('\n')
  : q.opts.filter(o => o[1]).map(o => md(o[0])).join('; ');
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const missIds = () => allQ().filter(id => ['m', 'p'].includes(gradeOf(id)));
const go = (h, replace) => { if (location.hash === '#' + h) route(); else if (replace) { history.replaceState(null, '', '#' + h); route(); } else location.hash = h; };

function itemHTML(it, withNote, showAll) {

    ${withNote ? `<details class="note" ${note ? 'open' : ''}><summary>✎ My notes</summary><textarea data-note="${it.id}" placeholder="Anything you want to remember about this item. Saved as you type.">${esc(note)}</textarea></details>` : ''}

document.addEventListener('input', e => {

/* ---------- sessions ---------- */
function startSession(kind, id, title, list, fresh) {
  const S = P.sess;
  if (!fresh && S && !S.done && S.kind === kind && S.id === id && S.list.length) return go('run', true);
  P.sess = {kind, id, title, list, i: 0, res: {}}; persist(); go('run', true);
}
function startBlock(id) { const b = BL[id]; startSession('block', id, 'Block ' + id + ' recall', bqs(b)); }
function startRedo() {
  const ids = shuffle(missIds());
  if (!ids.length) { app.innerHTML = `<header class="hero"><h1>Nothing to redo.</h1><p class="lede">Questions you grade “partly” or “missed” collect here. Come back after a block.</p><div class="row" style="margin-top:18px"><a class="btn pri" href="#home">Study home</a></div></header>`; return; }
  startSession('redo', 'redo', 'Redo misses', ids, !(P.sess && P.sess.kind === 'redo' && !P.sess.done));
}
function startDrill() {
  const w = id => { const e = P.q[id]; return !e ? 3 : e.g === 'm' ? 4 : e.g === 'p' ? 3 : 1; };
  const ids = allQ().map(id => [Math.pow(Math.random(), 1 / w(id)), id]).sort((a, b) => b[0] - a[0]).slice(0, 20).map(x => x[1]);
  startSession('drill', 'drill', 'Mixed drill', ids, !(P.sess && P.sess.kind === 'drill' && !P.sess.done));
}

/* ---------- answer checking ---------- */
const norm = s => String(s).toLowerCase().normalize('NFKD').replace(/[̀-ͯ]/g, '').replace(/⁄/g, '/').replace(/[’‘`]/g, "'").replace(/&/g, ' and ')
  .replace(/[^a-z0-9/' ]+/g, ' ').replace(/\b(the|a|an)\b/g, ' ').replace(/\s+/g, ' ').trim();
function lev(a, b) { const m = a.length, n = b.length; if (Math.abs(m - n) > 2) return 9; const d = Array.from({length: m + 1}, (_, i) => [i]); for (let j = 1; j <= n; j++) d[0][j] = j;
  for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++) d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); return d[m][n]; }
function checkFill(q, val) {
  const v = norm(val); if (!v) return {ok: false};
  if ((q.x || []).some(x => norm(x) === v)) return {ok: false};
  // also accept the full term when the stem already prints part of it ("Supremacy Clause" for "the _____ Clause")
  const [pre, post] = q.q.split('_____').map(s => norm(s).split(' ').filter(Boolean));
  let w = v.split(' ');
  for (let k = Math.min(w.length - 1, post.length); k > 0; k--) if (w.slice(-k).join(' ') === post.slice(0, k).join(' ')) { w = w.slice(0, -k); break; }
  for (let k = Math.min(w.length - 1, pre.length); k > 0; k--) if (w.slice(0, k).join(' ') === pre.slice(-k).join(' ')) { w = w.slice(k); break; }
  const cands = [...new Set([v, w.join(' ')])];
  for (const c of cands) for (const a of q.a) { if (norm(a) === c) return {ok: true}; }
  for (const c of cands) for (const a of q.a) { const n = norm(a); if (n.length >= 6 && !/\d/.test(n) && lev(n, c) <= (n.length >= 12 ? 2 : 1)) return {ok: true, typo: true}; }
  return {ok: false};
}
function record(qid, g, ans) {
  const S = P.sess, r = S.res[qid] = S.res[qid] || {}, first = !r.g;
  r.g = g; if (ans != null) r.ans = ans;
  const e = P.q[qid] = P.q[qid] || {n: 0};
  e.g = g; e.t = Date.now(); if (first) e.n++; if (ans != null) e.ans = ans;
  persist();
}

/* ---------- run ---------- */
function viewRun() {
  const S = P.sess; if (!S || !S.list.length) return go('home');
  if (S.done) return viewSummary();
  const qid = S.list[S.i], q = QS[qid], r = S.res[qid] = S.res[qid] || {}, it = ITEMS[q.item], done = !!r.g;
  const kind = {open: 'Explain', fill: 'Fill in the blank', tf: 'True or false', order: 'Put in order', sort: 'Sort', pick: 'Pick all that apply'}[q.k];
  const mine = Array.isArray(r.ans) ? r.ans : null, verdict = r.g === 'g' ? 'Correct' : r.g === 'p' ? 'Close' : 'Not quite';
  const size = (q.items || q.opts || []).length;
  if (size && !done && r.ord && r.ord.length !== size) { delete r.ord; delete r.seq; delete r.pl; delete r.sel; delete r.hist; }
  let body = '';
  if (q.k === 'open') {
    body = `<div class="qtext">${md(q.q)}</div>
      <textarea id="ans" placeholder="Say it or type it. Rough is fine." ${r.shown ? 'readonly' : ''}>${esc(r.ans || '')}</textarea>
      ${r.shown ? `<div class="fb ${r.g || ''}"><div class="lab">Model answer</div><div class="ans">${md(q.a)}</div></div>
        <div class="grade"><span class="hint">How close were you?</span>
          <button class="btn g ${r.g === 'g' ? 'sel' : ''}" data-g="g">Got it <kbd>1</kbd></button>
          <button class="btn p ${r.g === 'p' ? 'sel' : ''}" data-g="p">Partly <kbd>2</kbd></button>
          <button class="btn m ${r.g === 'm' ? 'sel' : ''}" data-g="m">Missed <kbd>3</kbd></button></div>`
        : `<div class="grade"><button class="btn pri" id="show">Show answer <kbd>⌘↵</kbd></button><span class="hint">Answer first, even if it's rough.</span></div>`}`;
  } else if (q.k === 'fill') {
    const parts = q.q.split('_____');
    const mid = done ? (r.g === 'g' ? `<span class="filled g">${esc(q.a[0])}</span>` : `${r.ans ? `<span class="filled m">${esc(r.ans)}</span>` : ''}<span class="filled g">${esc(q.a[0])}</span>`)
      : `<input class="blank" id="ans" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Your answer">`;
    body = `<div class="qtext">${md(parts[0])}${mid}${md(parts[1] || '')}</div>
      ${done ? `<div class="fb ${r.g}"><div class="lab">${r.g === 'g' ? (r.typo ? 'Counted, but check the spelling' : 'Correct') : 'Not quite'}</div><div class="ans">${r.g === 'g' && !r.typo ? '' : 'Answer: '}<b>${esc(q.a[0])}</b></div></div>
        ${r.g === 'm' && r.ans ? `<div class="grade"><button class="btn sm" id="override">I had it right (count it)</button></div>` : ''}`
        : `<div class="grade"><button class="btn pri" id="check">Check <kbd>↵</kbd></button><span class="hint">One or two words.</span></div>`}`;
  } else if (q.k === 'tf') {
    body = `<div class="qtext">${md(q.q)}</div>
      <div class="tf"><button class="btn big ${r.ans === true ? 'sel' : ''}" data-tf="1" ${done ? 'disabled' : ''}>True <kbd>T</kbd></button><button class="btn big ${r.ans === false ? 'sel' : ''}" data-tf="0" ${done ? 'disabled' : ''}>False <kbd>F</kbd></button></div>
      ${done ? `<div class="fb ${r.g}"><div class="lab">${r.g === 'g' ? 'Correct' : 'Not quite'} · the statement is ${q.a ? 'true' : 'false'}</div><div class="ans">${md(q.why || '')}</div></div>` : ''}`;
  }
  else if (q.k === 'order') {
    const n = q.items.length, L = 'ABCDEFGHIJ';
    if (!r.ord) { r.ord = shuffle(q.items.map((_, i) => i)); if (r.ord.every((v, i) => v === i)) r.ord.reverse(); }
    const seq = r.seq || [];
    body = `<div class="qtext">${md(q.q)}</div>` + (done
      ? `<ol class="seq res">${q.items.map((t, i) => `<li class="${mine ? (mine[i] === i ? 'g' : 'm') : ''}">${md(t)}${mine && mine[i] !== i ? `<span class="was">you had this ${ordinal(mine.indexOf(i) + 1)}</span>` : ''}</li>`).join('')}</ol>
        <div class="fb ${r.g}"><div class="lab">${verdict}</div><div class="ans">${r.g === 'g' ? 'All in the right place.' : 'This is the right order.'}</div></div>`
      : `<ol class="seq">${seq.map((ix, k) => `<li><button class="chip on" data-unplace="${k}" title="Take it back">${md(q.items[ix])}</button></li>`).join('')}${seq.length < n ? `<li class="slot">${seq.length ? 'next' : 'first'}</li>` : ''}</ol>
        <div class="pool">${r.ord.filter(ix => !seq.includes(ix)).map(ix => `<button class="chip" data-place="${ix}"><kbd>${L[r.ord.indexOf(ix)]}</kbd>${md(q.items[ix])}</button>`).join('')}</div>
        <div class="grade"><button class="btn pri" id="check2" ${seq.length < n ? 'disabled' : ''}>Check <kbd>↵</kbd></button><span class="hint">Click them in order, or press the letters. Click a placed one to take it back.</span></div>`);
  } else if (q.k === 'sort') {
    if (!r.ord) r.ord = shuffle(q.items.map((_, i) => i));
    const pl = r.pl || [], active = r.ord.find(ix => pl[ix] == null);
    body = `<div class="qtext">${md(q.q)}</div>` + (done
      ? `<div class="sortl">${r.ord.map(ix => { const ok = mine && mine[ix] === q.items[ix][1]; return `<div class="srow ${mine ? (ok ? 'g' : 'm') : ''}"><span class="st">${md(q.items[ix][0])}</span><span class="sb">${mine && !ok && mine[ix] != null ? `<span class="bk was">${md(q.buckets[mine[ix]])}</span>` : ''}<span class="bk on">${md(q.buckets[q.items[ix][1]])}</span></span></div>`; }).join('')}</div>
        <div class="fb ${r.g}"><div class="lab">${verdict}</div><div class="ans">${mine ? q.items.filter((x, i) => mine[i] === x[1]).length + ' of ' + q.items.length + ' in the right place.' : ''}</div></div>`
      : `<div class="sortl">${r.ord.map(ix => `<div class="srow ${ix === active ? 'act' : ''}"><span class="st">${md(q.items[ix][0])}</span><span class="sb">${q.buckets.map((b, bi) => `<button class="bk ${pl[ix] === bi ? 'on' : ''}" data-sort="${ix}:${bi}"><kbd>${bi + 1}</kbd>${md(b)}</button>`).join('')}</span></div>`).join('')}</div>
        <div class="grade"><button class="btn pri" id="check2" ${active == null ? '' : 'disabled'}>Check <kbd>↵</kbd></button><span class="hint">Click a label on each row, or press its number for the highlighted row. Backspace undoes.</span></div>`);
  } else if (q.k === 'pick') {
    if (!r.ord) r.ord = shuffle(q.opts.map((_, i) => i));
    const sel = r.sel || [], L = 'ABCDEFGHIJ';
    body = `<div class="qtext">${md(q.q)}</div>` + (done
      ? `<div class="pickl">${r.ord.map(ix => { const key = q.opts[ix][1], had = mine && mine.includes(ix); const c = key ? (had || !mine ? 'g' : 'miss') : had ? 'm' : 'off'; return `<div class="pk ${c}"><span>${md(q.opts[ix][0])}</span><span class="tagr">${c === 'g' ? 'yes' : c === 'miss' ? 'yes, you skipped it' : c === 'm' ? 'no' : ''}</span></div>`; }).join('')}</div>
        <div class="fb ${r.g}"><div class="lab">${verdict}</div><div class="ans">${q.opts.filter(o => o[1]).length} of the ${q.opts.length} belong.</div></div>`
      : `<div class="pickl">${r.ord.map((ix, k) => `<button class="pk ${sel.includes(ix) ? 'on' : ''}" data-pick="${ix}"><kbd>${L[k]}</kbd><span>${md(q.opts[ix][0])}</span></button>`).join('')}</div>
        <div class="grade"><button class="btn pri" id="check2" ${sel.length ? '' : 'disabled'}>Check <kbd>↵</kbd></button><span class="hint">Pick every one that fits. Click, or press the letters.</span></div>`);
  }
  const last = S.i === S.list.length - 1;
  app.innerHTML = `
  <header class="hero" style="padding-bottom:0">
    <div class="eyebrow">${esc(S.title)} · question ${S.i + 1} of ${S.list.length}</div>
    ${S.kind === 'block' ? '<div class="steps"><span>1 · Read</span><span class="on">2 · Recall</span></div>' : ''}
    <div class="dots">${S.list.map((id, i) => `<button class="${(S.res[id] || {}).g || ''} ${i === S.i ? 'cur' : ''}" data-i="${i}" aria-label="Question ${i + 1}"></button>`).join('')}</div>
  </header>
  <div class="qcard">
    <div class="qkind"><span>${kind}${q.detail ? '<span class="dchip">Detail</span>' : ''}</span><button class="flagb ${P.flags[qid] ? 'on' : ''}" id="flag" title="Flag this question as unclear or wrong">⚑ ${P.flags[qid] ? 'Flagged' : 'Flag'}</button></div>
    ${body}
    ${done ? `<div class="from"><details><summary>From: ${md(it.t)} · show the reading</summary>${itemHTML(it, false, true)}</details></div>` : ''}
  </div>
  <div class="qnav">
    <button class="btn" id="prev" ${S.i === 0 ? 'disabled' : ''}>← Back</button>
    <span class="hint">${done ? 'Enter for next' : ''}</span>
    <button class="btn ${done ? 'pri' : ''}" id="next">${last ? (done ? 'Finish →' : 'Skip to finish') : done ? 'Next →' : 'Skip'}</button>
  </div>`;
  const a = $('#ans'); if (a && !a.readOnly) a.focus();
  if (done && !a) $('#next').focus();
}
function act(what, arg) {
  const S = P.sess; if (!S || S.done || !location.hash.startsWith('#run')) return;
  const qid = S.list[S.i], q = QS[qid], r = S.res[qid] = S.res[qid] || {};
  if (what === 'show' && q.k === 'open' && !r.shown) { r.ans = $('#ans').value; r.shown = true; persist(); viewRun(); document.activeElement && document.activeElement.blur(); }
  else if (what === 'grade' && q.k === 'open' && r.shown) { record(qid, arg, r.ans); viewRun(); $('#next').focus(); }
  else if (what === 'check' && q.k === 'fill' && !r.g) { const v = $('#ans').value.trim(); if (!v) return; const c = checkFill(q, v); r.typo = !!c.typo; record(qid, c.ok ? 'g' : 'm', v); viewRun(); }
  else if (what === 'override' && q.k === 'fill') { r.typo = false; record(qid, 'g', r.ans); viewRun(); }
  else if (what === 'tf' && q.k === 'tf' && !r.g) { record(qid, arg === q.a ? 'g' : 'm', arg); viewRun(); }
  else if (what === 'place' && q.k === 'order' && !r.g) { r.seq = r.seq || []; if (!r.seq.includes(arg)) r.seq.push(arg); viewRun(); }
  else if (what === 'unplace' && q.k === 'order' && !r.g) { (r.seq || []).splice(arg, 1); viewRun(); }
  else if (what === 'sort' && q.k === 'sort' && !r.g) { r.pl = r.pl || []; r.pl[arg[0]] = arg[1]; r.hist = (r.hist || []).filter(x => x !== arg[0]).concat(arg[0]); viewRun(); }
  else if (what === 'unsort' && q.k === 'sort' && !r.g && (r.hist || []).length) { r.pl[r.hist.pop()] = null; viewRun(); }
  else if (what === 'toggle' && q.k === 'pick' && !r.g) { r.sel = r.sel || []; const i = r.sel.indexOf(arg); if (i < 0) r.sel.push(arg); else r.sel.splice(i, 1); viewRun(); }
  else if (what === 'check2' && !r.g) {
    if (q.k === 'order') { const s = r.seq || []; if (s.length < q.items.length) return; const bad = s.filter((ix, n) => ix !== n).length; record(qid, bad === 0 ? 'g' : bad <= 2 ? 'p' : 'm', s.slice()); }
    else if (q.k === 'sort') { const pl = r.pl || []; if (q.items.some((_, i) => pl[i] == null)) return; const bad = q.items.filter((x, i) => pl[i] !== x[1]).length; record(qid, bad === 0 ? 'g' : (bad === 1 || bad / q.items.length <= .2) ? 'p' : 'm', pl.slice()); }
    else if (q.k === 'pick') { const sel = r.sel || []; if (!sel.length) return; const bad = q.opts.filter((o, i) => o[1] !== sel.includes(i)).length; record(qid, bad === 0 ? 'g' : bad === 1 ? 'p' : 'm', sel.slice()); }
    else return;
    viewRun();
  }
  else if (what === 'next') { if (S.i < S.list.length - 1) { S.i++; persist(); viewRun(); window.scrollTo(0, 0); } else finish(); }
  else if (what === 'prev' && S.i > 0) { S.i--; persist(); viewRun(); }
  else if (what === 'jump') { S.i = arg; persist(); viewRun(); }
  else if (what === 'flag') { if (P.flags[qid]) delete P.flags[qid]; else P.flags[qid] = true; persist(); viewRun(); }
}
function finish() {
  const S = P.sess; S.done = true;
  if (S.kind === 'block') { const b = P.blocks[S.id] = P.blocks[S.id] || {}; b.done = Date.now(); }
  persist(); viewSummary(); window.scrollTo(0, 0);
}
function viewSummary() {
  const S = P.sess, c = {g: 0, p: 0, m: 0, n: 0}; S.list.forEach(id => c[(S.res[id] || {}).g || 'n']++);
  const bad = S.list.filter(id => ['m', 'p'].includes((S.res[id] || {}).g));
  const bi = S.kind === 'block' ? D.blocks.findIndex(b => b.id === S.id) : -1, nb = bi >= 0 ? D.blocks[bi + 1] : null;
  const ansText = modelText;
  app.innerHTML = `
  <header class="hero">
    <div class="eyebrow">${esc(S.title)} · done</div>
    <div class="score">${c.g}<span style="color:var(--muted);font-size:26px"> / ${S.list.length}</span></div>
    <div class="count"><span><i class="dotk" style="background:var(--ok)"></i><b>${c.g}</b> got it</span><span><i class="dotk" style="background:var(--part)"></i><b>${c.p}</b> partly</span><span><i class="dotk" style="background:var(--miss)"></i><b>${c.m}</b> missed</span>${c.n ? `<span><b>${c.n}</b> skipped</span>` : ''}</div>
    <div class="row" style="margin-top:20px">
      ${bad.length ? `<button class="btn pri big" id="again">Redo these ${bad.length} now</button>` : ''}
      ${nb ? `<a class="btn ${bad.length ? '' : 'pri'} big" href="#b/${nb.id}">Next: block ${nb.id} →</a>` : ''}
      ${S.kind === 'block' ? `<a class="btn big" href="#b/${S.id}">Re-read this block</a>` : ''}
      <a class="btn big" href="#home">Study home</a>
    </div>
  </header>
  ${bad.length ? `<section class="sec"><div class="sec-h"><h2>What to look at again</h2></div><div class="miss-list">${bad.map(id => { const q = QS[id]; return `<div class="ml"><div class="q">${md(q.q)}</div><div class="a">${ansText(q)}</div></div>`; }).join('')}</div></section>` : `<p class="lede">Clean pass. Come back to this block tomorrow and see if it holds.</p>`}`;
  const ag = $('#again'); if (ag) ag.onclick = () => startSession('again', S.id, 'Redo: ' + S.title.replace(/^Redo: /, ''), shuffle(bad), true);
}

/* ---------- notes & flags ---------- */
function viewNotes() {
  const ns = Object.keys(P.notes).filter(id => ITEMS[id]), fs = Object.keys(P.flags).filter(id => QS[id]);
  app.innerHTML = `
  <header class="hero"><div class="eyebrow">Yours</div><h1>My notes <em>&amp; flags</em></h1>
    <p class="lede">Notes you typed under an item while reading, and questions you flagged. Edit notes here or in the block. Use <b>Save to file</b> to keep a copy.</p></header>
  <section class="sec"><div class="sec-h"><h2>Notes</h2><span class="ct">${ns.length}</span></div>
    ${ns.length ? ns.map(id => `<div class="panel" style="margin-bottom:10px"><div class="eyebrow" style="letter-spacing:.08em">${esc(ITEMS[id].sec)} · <a href="#b/${ITEMS[id].block}">block ${ITEMS[id].block}</a></div><h3 style="margin:6px 0 10px">${md(ITEMS[id].t)}</h3><textarea data-note="${id}">${esc(P.notes[id])}</textarea></div>`).join('') : '<p class="blurb" style="margin:0">None yet. Open a block and use “My notes” under any item.</p>'}
  </section>
  <section class="sec"><div class="sec-h"><h2>Flagged questions</h2><span class="ct">${fs.length}</span></div>
    ${fs.length ? `<div class="miss-list">${fs.map(id => `<div class="ml"><div class="q">${md(QS[id].q)}</div><div class="a">${modelText(QS[id])}</div><div style="margin-top:8px"><button class="btn sm" data-unflag="${id}">Remove flag</button> <span class="hint">${id}</span></div></div>`).join('')}</div>` : '<p class="blurb" style="margin:0">None. Use ⚑ on any question that seems unclear or wrong.</p>'}
  </section>
  <section class="sec"><div class="sec-h"><h2>Start over</h2></div><button class="btn sm" id="reset">Erase all grades in this browser</button> <span class="hint">Notes and flags are kept.</span></section>`;
  $('#reset').onclick = () => { if (confirm('Erase every grade and answer stored in this browser? Notes and flags stay.')) { P.q = {}; P.blocks = {}; P.sess = null; persist(); go('home'); } };
}

/* ---------- events ---------- */
app.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.id === 'show') act('show'); else if (t.id === 'check') act('check'); else if (t.id === 'override') act('override');
  else if (t.id === 'next') act('next'); else if (t.id === 'prev') act('prev'); else if (t.id === 'flag') act('flag');
  else if (t.id === 'check2') act('check2');
  else if (t.dataset.place != null) act('place', +t.dataset.place);
  else if (t.dataset.unplace != null) act('unplace', +t.dataset.unplace);
  else if (t.dataset.sort) act('sort', t.dataset.sort.split(':').map(Number));
  else if (t.dataset.pick != null) act('toggle', +t.dataset.pick);
  else if (t.dataset.g) act('grade', t.dataset.g); else if (t.dataset.tf) act('tf', t.dataset.tf === '1');
  else if (t.dataset.i) act('jump', +t.dataset.i);
  else if (t.dataset.unflag) { delete P.flags[t.dataset.unflag]; persist(); viewNotes(); }
  else if (t.dataset.mode) { const y = window.scrollY; P.ui.mode = t.dataset.mode; persist(); route(); window.scrollTo(0, y); }
});
document.addEventListener('keydown', e => {
  const S = P.sess; if (!S || S.done || !location.hash.startsWith('#run')) return;
  const q = QS[S.list[S.i]], r = S.res[S.list[S.i]] || {}, tag = (e.target.tagName || '').toLowerCase();
  const typing = (tag === 'textarea' && !e.target.readOnly) || tag === 'input';
  if (e.key === 'Enter') {
    if (q.k === 'open' && !r.shown) { if (e.metaKey || e.ctrlKey) { e.preventDefault(); act('show'); } return; }
    if (q.k === 'fill' && !r.g) { e.preventDefault(); act('check'); return; }
    if (['order', 'sort', 'pick'].includes(q.k) && !r.g) { e.preventDefault(); act('check2'); return; }
    if (r.g && tag !== 'button') { e.preventDefault(); act('next'); }
    return;
  }
  if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase(), li = k.length === 1 ? 'abcdefghij'.indexOf(k) : -1;
  if (!r.g && q.k === 'order') { if (li >= 0 && r.ord && li < r.ord.length) { e.preventDefault(); act('place', r.ord[li]); } else if (k === 'backspace' && (r.seq || []).length) { e.preventDefault(); act('unplace', r.seq.length - 1); } return; }
  if (!r.g && q.k === 'sort') { const d = +k, pl = r.pl || [], a = (r.ord || []).find(ix => pl[ix] == null); if (d >= 1 && d <= q.buckets.length && a != null) { e.preventDefault(); act('sort', [a, d - 1]); } else if (k === 'backspace') { e.preventDefault(); act('unsort'); } return; }
  if (!r.g && q.k === 'pick') { if (li >= 0 && r.ord && li < r.ord.length) { e.preventDefault(); act('toggle', r.ord[li]); } return; }
  if (q.k === 'open' && r.shown && ['1', '2', '3'].includes(k)) { e.preventDefault(); act('grade', {1: 'g', 2: 'p', 3: 'm'}[k]); }
  else if (q.k === 'tf' && !r.g && (k === 't' || k === 'f')) { e.preventDefault(); act('tf', k === 't'); }
  else if (k === 'arrowright' && r.g) act('next');
  else if (k === 'arrowleft') act('prev');
});

/* ---------- router ---------- */
function route() {
  const [a, b, c] = (location.hash.slice(1) || 'home').split('/');
  window.scrollTo(0, 0);
  if (a === 'b' && BL[b]) return c === 'recall' ? startBlock(b) : viewRead(b);
  if (a === 'run') return viewRun();
  if (a === 'redo') return startRedo();
  if (a === 'drill') return startDrill();
  if (a === 'notes') return viewNotes();
  viewHome();
}
window.addEventListener('hashchange', route);
if (P.saved) setMsg('In this browser · ' + ago(P.saved));
route();
linkUI();
if (CLOUD && !code) setMsg('Sync is off on this device.');
if (syncing()) pull();
if (SERVER) fetch('api/cloud').then(r => r.ok ? r.json() : null).then(j => { if (j && j.url) { const w = $('#web'); w.href = j.url + '/study.html' + (j.code ? '#sync=' + j.code : ''); w.target = '_blank'; w.rel = 'noopener'; w.hidden = false; } }).catch(() => {});
</script>
</body>
</html>
