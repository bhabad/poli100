<style>
:root{
  --bg:#0a0f1d; --bg2:#0e1528; --surface:#121b31; --surface2:#17223d; --line:#22304f; --line2:#2e3f66;
  --ink:#f1ece0; --ink2:#c9c4b8; --muted:#8d97ad; --faint:#5d6882;
  --red:#d6404a; --red-soft:rgba(214,64,74,.14); --blue:#6d93f2; --blue-soft:rgba(109,147,242,.14);
  --gold:#e3b456; --gold-soft:rgba(227,180,86,.14); --ivory:#f4efe3;
  --ok:#7fa6ff; --part:#e3b456; --miss:#d6404a;
  --serif:"Libre Caslon Text",Georgia,"Times New Roman",serif;
  --sans:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:12px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15.5px/1.6 var(--sans);-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 500px at 85% -10%,rgba(109,147,242,.10),transparent 60%),radial-gradient(900px 400px at -10% 0%,rgba(214,64,74,.07),transparent 60%);background-attachment:fixed}
a{color:var(--blue)}
button{font:inherit;color:inherit}
.wrap{max-width:860px;margin:0 auto;padding:0 20px}
.flag{height:8px;display:flex}
.flag .canton{width:92px;background:#1c2d5c;position:relative;overflow:hidden}
.flag .canton::after{content:"";position:absolute;inset:0;background-image:radial-gradient(circle,#f4efe3 1px,transparent 1.4px);background-size:8px 4px;opacity:.75}
.flag .stripes{flex:1;background:repeating-linear-gradient(90deg,var(--red) 0 46px,var(--ivory) 46px 52px)}
nav.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 0;border-bottom:1px solid var(--line)}
nav.top a.home{font:500 12px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);text-decoration:none}
nav.top a.home:hover{color:var(--ink)}
nav.top .sp{flex:1}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line2);background:rgba(18,27,49,.6);border-radius:999px;padding:8px 14px;font:500 13px/1 var(--sans);color:var(--ink2);cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{color:var(--ink);border-color:var(--ink2)}
.btn.pri{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}
.btn.pri:hover{background:#fff;color:var(--bg)}
.btn.big{padding:13px 20px;font-size:15px;border-radius:12px}
.btn.sm{padding:6px 10px;font-size:12px}
.btn[disabled]{opacity:.4;cursor:default}
.btn:focus-visible,.card:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
#savemsg{font:500 11.5px var(--mono);color:var(--muted)}
.eyebrow{font:500 12px/1.4 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.eyebrow .star{color:var(--red)}
h1{font:700 clamp(30px,5vw,46px)/1.05 var(--serif);margin:12px 0 10px;letter-spacing:-.01em;text-wrap:balance}
h1 em{font-style:italic;font-weight:400;color:var(--ink2)}
h2{font:700 24px/1.15 var(--serif);margin:0;text-wrap:balance}
h3{font:700 19px/1.25 var(--serif);margin:0;text-wrap:balance}
.lede{color:var(--ink2);margin:0;max-width:680px}
header.hero{padding:34px 0 8px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.meter{height:8px;background:var(--line);border-radius:8px;overflow:hidden;display:flex}
.meter i{display:block;height:100%}
.meter .g{background:var(--ok)} .meter .p{background:var(--part)} .meter .m{background:var(--miss)}
.count{font:500 12px var(--mono);color:var(--muted);display:flex;gap:14px;flex-wrap:wrap;margin-top:8px}
.count b{color:var(--ink);font-weight:500}
.dotk{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px}
.how{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:22px 0 0}
.how .panel{font-size:14px;color:var(--ink2)}
.how .n{font:500 11px var(--mono);letter-spacing:.14em;color:var(--red);display:block;margin-bottom:6px}
.sec{margin-top:34px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:14px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:14px}
.sec-h .roman{font:500 12px var(--mono);color:var(--red);letter-spacing:.12em;margin-right:10px}
.sec-h .ct{font:500 12px var(--mono);color:var(--muted)}
.blurb{color:var(--muted);font-size:14px;margin:-6px 0 14px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{display:flex;flex-direction:column;gap:8px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 15px;text-decoration:none;color:var(--ink);transition:border-color .15s,background .15s}
.card:hover{border-color:var(--line2);background:var(--surface2)}
.card .id{font:500 11px var(--mono);letter-spacing:.1em;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.card .t{font:700 16px/1.25 var(--serif)}
.card .sub{font-size:12.5px;color:var(--muted);margin-top:auto}
.card .acts{display:flex;gap:8px;margin-top:4px}
.badge{font:600 10.5px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:4px 6px;border-radius:5px;white-space:nowrap}
.b-new{background:rgba(141,151,173,.12);color:var(--ink2)} .b-ok{background:var(--blue-soft);color:var(--ok)} .b-part{background:var(--gold-soft);color:var(--gold)} .b-miss{background:var(--red-soft);color:#f08088}
.plan{display:grid;gap:8px;margin-top:10px}
.plan .dt{display:flex;gap:14px;align-items:baseline;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg2);font-size:14px;color:var(--ink2)}
.plan .dt b.d{font:600 12px var(--mono);color:var(--ink);min-width:118px;flex:none}
/* read view */
.steps{display:flex;gap:8px;margin:18px 0 6px;font:500 12px var(--mono);letter-spacing:.08em;text-transform:uppercase}
.steps span{padding:6px 10px;border-radius:999px;border:1px solid var(--line2);color:var(--muted)}
.steps span.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
article.item{border-top:1px solid var(--line);padding:24px 0 20px}
article.item:first-of-type{border-top:0}
.item .src{font:500 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.item ul.rd{margin:12px 0 0;padding:0;list-style:none;display:grid;gap:9px}
.item ul.rd li{position:relative;padding-left:20px;color:var(--ink2)}
.item ul.rd li::before{content:"";position:absolute;left:3px;top:.72em;width:6px;height:6px;border-radius:50%;background:var(--line2)}
.item ul.rd b{color:var(--ink);font-weight:600}
.trap{margin-top:12px;padding:10px 12px;border-radius:10px;border:1px solid rgba(227,180,86,.35);background:var(--gold-soft);font-size:14px;color:var(--ink);display:flex;gap:10px}
.trap .ic{font:600 10.5px/1.9 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--gold);flex:none}
.core{margin-top:12px;padding:13px 15px;border-radius:10px;border:1px solid rgba(109,147,242,.4);background:var(--blue-soft)}
.core .lab{font:600 10.5px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ok);margin-bottom:9px}
.core ul{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.core li{color:var(--ink);font-size:16px;line-height:1.5}
.core b{font-weight:600}
.dlab{font:500 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:16px}
details.more{margin-top:14px}
details.more summary{cursor:pointer;font:500 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
details.more summary:hover{color:var(--ink)}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:999px;padding:3px;background:rgba(18,27,49,.6);flex-wrap:wrap}
.seg button{border:0;background:none;border-radius:999px;padding:7px 13px;font:500 13px/1 var(--sans);color:var(--ink2);cursor:pointer}
.seg button.on{background:var(--ink);color:var(--bg);font-weight:600}
.dchip{font:600 10px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line2);border-radius:5px;padding:3px 5px;margin-left:8px}
details.note{margin-top:12px}
details.note summary{cursor:pointer;font:500 12px var(--mono);letter-spacing:.06em;color:var(--muted);list-style:none;display:inline-flex;gap:6px;align-items:center}
details.note summary::-webkit-details-marker{display:none}
details.note summary:hover{color:var(--ink)}
textarea,input[type=text]{font:inherit;color:var(--ink);background:var(--bg2);border:1px solid var(--line2);border-radius:10px;padding:10px 12px;width:100%}
textarea{min-height:96px;resize:vertical;line-height:1.5}
details.note textarea{margin-top:8px;min-height:70px;font-size:14px}
.cta{position:sticky;bottom:0;padding:30px 0 18px;background:linear-gradient(180deg,rgba(10,15,29,0),var(--bg) 42%);display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}
/* run view */
.dots{display:flex;gap:5px;flex-wrap:wrap;margin:14px 0 18px}
.dots button{width:18px;height:8px;border-radius:4px;border:0;background:var(--line);cursor:pointer;padding:0}
.dots button.g{background:var(--ok)} .dots button.p{background:var(--part)} .dots button.m{background:var(--miss)}
.dots button.cur{outline:2px solid var(--ink);outline-offset:2px}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px 24px 20px}
.qkind{font:500 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;gap:10px;align-items:center}
.qtext{font:400 21px/1.4 var(--serif);margin:14px 0 18px;text-wrap:pretty}
.qtext input.blank{display:inline-block;width:11em;max-width:100%;font:500 18px var(--sans);padding:5px 10px;margin:0 4px;vertical-align:baseline;border-radius:8px}
.qtext .filled{display:inline-block;padding:1px 10px;border-radius:8px;font:600 18px var(--sans);margin:0 2px}
.filled.g{background:var(--blue-soft);color:var(--ok)} .filled.m{background:var(--red-soft);color:#f08088;text-decoration:line-through}
.tf{display:flex;gap:10px}
.tf .btn{flex:1;justify-content:center}
.tf .btn.sel{border-color:var(--ink);color:var(--ink)}
.fb{margin-top:16px;padding:14px 16px;border-radius:12px;border:1px solid var(--line2);background:var(--bg2)}
.fb.g{border-color:rgba(109,147,242,.45);background:var(--blue-soft)} .fb.m{border-color:rgba(214,64,74,.45);background:var(--red-soft)} .fb.p{border-color:rgba(227,180,86,.4);background:var(--gold-soft)}
.fb .lab{font:600 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.fb.g .lab{color:var(--ok)} .fb.m .lab{color:#f08088} .fb.p .lab{color:var(--gold)}
.fb .ans{white-space:pre-line;color:var(--ink)}
.fb .ans b{font-weight:600}
.grade{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;align-items:center}
.grade .btn kbd,.btn kbd{font:500 10.5px var(--mono);border:1px solid currentColor;border-radius:4px;padding:1px 4px;opacity:.6}
.grade .btn.g.sel{background:var(--blue-soft);border-color:var(--ok);color:var(--ok)}
.grade .btn.p.sel{background:var(--gold-soft);border-color:var(--gold);color:var(--gold)}
.grade .btn.m.sel{background:var(--red-soft);border-color:var(--miss);color:#f08088}
.from{margin-top:14px;font-size:13px;color:var(--muted)}
.from details summary{cursor:pointer;color:var(--ink2)}
.from details .item{padding:6px 0 0;border:0}
.qnav{display:flex;justify-content:space-between;gap:10px;margin-top:18px;align-items:center;flex-wrap:wrap}
.flagb{background:none;border:0;cursor:pointer;color:var(--faint);font-size:15px;padding:4px 6px;border-radius:6px}
.flagb:hover{color:var(--ink2)} .flagb.on{color:var(--gold)}
.hint{font:500 11.5px var(--mono);color:var(--faint)}
/* order / sort / pick: answered with clicks or single keys */
.chip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line2);background:var(--bg2);color:var(--ink);border-radius:10px;padding:9px 12px;font:500 14.5px/1.3 var(--sans);cursor:pointer;text-align:left}
.chip:hover{border-color:var(--ink2)}
.chip.on{background:var(--surface2);border-color:var(--blue)}
.chip kbd,.bk kbd,.pk kbd{font:500 10.5px var(--mono);border:1px solid currentColor;border-radius:4px;padding:1px 5px;opacity:.55;flex:none}
.pool{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 0}
ol.seq{margin:0;padding:0;list-style:none;counter-reset:s;display:grid;gap:8px}
ol.seq li{counter-increment:s;display:flex;align-items:center;gap:10px;min-height:40px}
ol.seq li::before{content:counter(s);font:600 12px var(--mono);color:var(--muted);width:24px;height:24px;border:1px solid var(--line2);border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex:none}
ol.seq li.slot{color:var(--faint);font:500 13px var(--mono)}
ol.seq.res li{padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg2)}
ol.seq.res li.g{border-color:rgba(109,147,242,.45)} ol.seq.res li.m{border-color:rgba(214,64,74,.5)}
.was{margin-left:auto;font:500 11.5px var(--mono);color:#f08088;white-space:nowrap}
.sortl{display:grid;gap:8px}
.srow{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg2)}
.srow.act{border-color:var(--ink2)}
.srow.g{border-color:rgba(109,147,242,.45)} .srow.m{border-color:rgba(214,64,74,.5)}
.srow .st{flex:1;min-width:200px}
.srow .sb{display:flex;gap:6px;flex-wrap:wrap}
.bk{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);background:none;color:var(--ink2);border-radius:999px;padding:6px 11px;font:500 12.5px/1.2 var(--sans)}
button.bk{cursor:pointer} button.bk:hover{color:var(--ink);border-color:var(--ink2)}
button.bk.on{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}
span.bk.on{background:var(--blue-soft);color:var(--ok);border-color:rgba(109,147,242,.5)}
span.bk.was{color:#f08088;border-color:rgba(214,64,74,.5);text-decoration:line-through;margin:0}
.pickl{display:grid;gap:8px}
.pk{display:flex;align-items:center;gap:10px;text-align:left;border:1px solid var(--line2);background:var(--bg2);color:var(--ink);border-radius:10px;padding:10px 12px;font:500 15px/1.35 var(--sans);width:100%}
button.pk{cursor:pointer} button.pk:hover{border-color:var(--ink2)}
button.pk.on{border-color:var(--blue);background:var(--blue-soft)}
div.pk.g{border-color:rgba(109,147,242,.5);background:var(--blue-soft)}
div.pk.miss{border-color:rgba(227,180,86,.55);background:var(--gold-soft)}
div.pk.m{border-color:rgba(214,64,74,.5);background:var(--red-soft)}
div.pk.off{opacity:.5}
.pk .tagr{margin-left:auto;font:600 11px var(--mono);letter-spacing:.04em;white-space:nowrap;color:var(--ink2)}
/* summary */
.score{font:700 54px/1 var(--serif);margin:6px 0}
.miss-list{display:grid;gap:10px;margin-top:14px}
.miss-list .ml{padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg2);font-size:14px}
.miss-list .ml .q{color:var(--ink)} .miss-list .ml .a{color:var(--ink2);margin-top:6px;white-space:pre-line}
footer{border-top:1px solid var(--line);margin-top:50px;padding:20px 0 50px;color:var(--muted);font-size:13px}
@media (max-width:720px){
  .wrap{padding:0 16px}
  .how{grid-template-columns:1fr}
  .qcard{padding:18px 16px}
  .qtext{font-size:19px}
  .plan .dt{flex-direction:column;gap:2px}
  .cta .btn:not(.pri),.cta>span{display:none}
  .cta .btn.pri{flex:1;justify-content:center}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<script id="data" type="application/json">{"asOf": "2026-10-11", "exam": {"date": "2026-10-14", "review": "2026-10-12", "facts": ["**40 questions**: multiple choice, true/false, and fill-in-the-blank (1–2 word answers). No essays (Lecture 13 slide, 5 Oct).", "Taken **on Canvas in a lockdown browser**, in the room. Taking it remotely = zero.", "Covers **everything on the study guide**: Founding, Federalism, Congress, Presidency, Judiciary.", "**Mon 10/12** = review, plus the last Judiciary topics: Hamilton on life tenure, Originalism vs Living Constitutionalism.", "**No recitation Wed 10/14.** The TA said the Jeopardy review games are a good preview of the question style.", "The study guide says \"Hamilton's **three** arguments for life tenure\"; the slides so far show two (independence, qualifications). Listen for the third on Monday."]}, "sections": [{"id": "I", "title": "The American Founding", "blurb": "Lectures 2–6. Thinkers, the road to 1776, the Articles, the Convention, and the ratification debate.", "items": [{"id": "aristotle", "t": "Aristotle's contributions to the Founders", "src": "Lecture 2", "core": ["**Polity** is his good, most practical form of rule by the many: a mixed government. In his table, democracy is a *bad* form.", "Contribution: **class conflict** is what destroys stability, so balance rich and poor through mixed government.", "The six names: monarchy / tyranny · aristocracy / oligarchy · polity / democracy."], "read": ["For the Greeks, the main obstacle to government was **political instability**.", "Aristotle's **six forms** of government: rule by one, few, or many, each in a good version (rules for the **common good**) and a bad version (rules for **private interest**).", "One: **monarchy** → **tyranny**. Few: **aristocracy** → **oligarchy** (rule by the wealthy). Many: **polity** → **democracy** (rule by the poor).", "Monarchy is best but rare and very risky; tyranny is the worst. **Polity** is the *most practical*: it reduces class conflict by respecting the interests of all. Democracy is bad, but “the best of a bad lot.”", "How a polity balances rich and poor: **property qualifications for holding office** set high (pleases the wealthy few) and **qualifications to vote** set low (reassures the working many).", "**Contribution to the Founders:** class conflict is the great bane of politics. Balancing the interests of factions (rich and poor) through **mixed government** promotes stability."], "trap": ["In Aristotle's table “democracy” is a *bad* form: the poor ruling for themselves. The good version of rule by the many is **polity**."], "q": [{"k": "sort", "q": "Rebuild Aristotle's table: put each form of government under its heading.", "buckets": ["One · good", "One · bad", "Few · good", "Few · bad", "Many · good", "Many · bad"], "items": [["Monarchy", 0], ["Tyranny", 1], ["Aristocracy", 2], ["Oligarchy", 3], ["Polity", 4], ["Democracy", 5]]}, {"k": "open", "q": "What separates Aristotle's good forms from his bad ones? And what did the Founders take from him?", "a": "Good forms rule for the common good; bad forms rule for the rulers' own interest.\nFrom him: class conflict is the great bane of politics, so balance rich and poor through mixed government to get stability."}, {"k": "fill", "q": "Aristotle's good form of rule by the many, the one he called most practical, is a(n) _____.", "a": ["polity"]}, {"k": "fill", "q": "In Aristotle's typology, the bad form of rule by the few is _____.", "a": ["oligarchy"]}, {"k": "tf", "q": "In Aristotle's typology, democracy is one of the bad forms: rule by the many for their own interest.", "a": true, "why": "Democracy is the bad form of rule by the many (the poor ruling for themselves). The good form is polity."}]}, {"id": "romans", "t": "The Romans' contributions to the Founders", "src": "Lecture 2", "core": ["**Polybius and Cicero.** Contribution: balance political **institutions** (consuls, Senate, assemblies) to get stability.", "Aristotle balanced classes; the Romans balanced institutions."], "read": ["**Polybius** (200–118 BC) and **Cicero** (106–43 BC) applied Aristotle's wisdom to Roman law and administration.", "Aristotle balanced *classes*. The Romans balanced **political institutions**: separation of power, checks and balances.", "The Roman Republic's mix: the **consuls** (executive, the monarchy element), the **Senate** (advisory body, the aristocracy element), and the **assemblies** (voting body, the democracy element).", "**Contribution to the Founders:** balancing political institutions → stability.", "Same lecture, lower priority: the **Middle Ages** gave the Founders *negative* examples (politics shouldn't serve religion; drop absolute monarchs, hereditary nobility, feudalism). Then the **Protestant Reformation** (a personal relationship with God) and the **Enlightenment** (reason and individualism over tradition and religion) shifted the focus to progress in this life."], "q": [{"k": "fill", "q": "The two Roman thinkers the Founders drew on for balanced institutions were Cicero and _____.", "a": ["Polybius"]}, {"k": "sort", "q": "In the Roman Republic's mixed government, which element did each institution supply?", "buckets": ["Monarchy", "Aristocracy", "Democracy"], "items": [["The consuls", 0], ["The Senate", 1], ["The assemblies", 2]]}, {"k": "tf", "q": "The Romans' contribution was balancing political institutions; Aristotle's was balancing the interests of rich and poor.", "a": true, "why": "Polybius and Cicero balanced institutions (consuls, Senate, assemblies). Aristotle balanced classes."}, {"k": "open", "q": "What did the Middle Ages contribute to the Founders' thinking?", "a": "Negative examples and warnings: politics shouldn't serve religion, and medieval hierarchies (absolute monarchs, hereditary nobility, feudalism) should be abandoned."}]}, {"id": "locke", "t": "Locke's contributions to the Founders", "src": "Lectures 2–3", "core": ["**Natural law** exists before government. In the social contract we give up two rights: to **judge disputes** and to **punish**.", "Legitimacy comes only from the **consent of the governed**. This is the thinking behind the Declaration of Independence."], "read": ["**Natural law**: moral truths that apply to all people independently of **positive law** (the laws a society makes). Natural laws existed before civilization, are given by God, and are discoverable by reason.", "“...no one ought to harm another in his **life, health, liberty, or possessions**” (*Second Treatise*).", "In the **state of nature** everyone has the right to punish those who break natural law, because there's no impartial judge. The punishment must be **proportionate**.", "**Social contract:** we consent to be governed and surrender two rights in exchange for protection: **(1) the right to judge disputes** and **(2) the right to punish**.", "Only the **consent of the governed** produces political legitimacy. Positive law must comply with natural law; if it doesn't, it's illegitimate and there's a **right to revolt**.", "**Contribution:** the Declaration of Independence asserts natural individual rights and grounds authority in consent: “Life, Liberty and the pursuit of Happiness... deriving their just powers from the consent of the governed.”"], "trap": ["The two surrendered rights were a clue in the TA's review game, described as an easy fill-in. Know them cold: **judge disputes** and **punish**."], "q": [{"k": "pick", "q": "Which rights do people surrender when they enter Locke's social contract? Pick all that apply.", "opts": [["The right to judge disputes", true], ["The right to punish", true], ["The right to life", false], ["The right to liberty", false], ["The right to possessions", false], ["The right to revolt", false]]}, {"k": "fill", "q": "For Locke, political legitimacy comes only from the _____ of the governed.", "a": ["consent"]}, {"k": "fill", "q": "Locke contrasts natural law with _____ law, the laws a society makes for itself.", "a": ["positive"]}, {"k": "tf", "q": "Locke held that natural law was created by governments once people left the state of nature.", "a": false, "why": "Natural law existed before civilization. It's given by God and discoverable by reason; governments make positive law."}, {"k": "open", "q": "For Locke, what follows when a society's positive law violates natural law? Which founding document shows his influence?", "a": "The law is illegitimate and the people have a right to revolt.\nThe Declaration of Independence: natural rights, plus “consent of the governed.”"}]}, {"id": "montesquieu", "t": "Montesquieu's contributions to the Founders", "src": "Lecture 3", "core": ["**Separation of powers** best preserves liberty: executive, legislative, and judicial power held separately, each able to check the others."], "read": ["French political philosopher (1689–1755), *The Spirit of the Laws*.", "**Separation of powers best preserves liberty.** He defines political liberty as “a tranquillity of mind arising from the opinion each person has of his safety.”", "We're safe from tyranny only if the **executive, legislative, and judicial** powers are separated *and able to check each other*.", "If one branch holds all governmental powers, people will have no confidence in their own **security**.", "The slide's examples: what if the president also held the power of the purse? What if Congress or the president had a monopoly on constitutional interpretation?"], "q": [{"k": "fill", "q": "The French philosopher who argued that separating executive, legislative, and judicial power best preserves liberty was _____.", "a": ["Montesquieu", "Baron de Montesquieu"]}, {"k": "open", "q": "State Montesquieu's contribution in a sentence. What happens, in his view, if one branch holds all the powers?", "a": "Separation of powers best preserves liberty: the three powers must be separate and able to check each other.\nIf one branch holds them all, people have no confidence in their own security (tyranny)."}, {"k": "tf", "q": "Montesquieu argued that liberty is safe only when the executive, legislative, and judicial powers are separated and able to check each other.", "a": true, "why": "That is his contribution: separation of powers best preserves liberty."}]}, {"id": "revwar", "t": "What events led to the American Revolutionary War?", "src": "Lecture 3", "core": ["The chain, in order: **Seven Years War** (debt) → **Sugar Act** and **Stamp Act** (“no taxation without representation”) → **Boston Tea Party** → **Intolerable Acts** → **First Continental Congress**.", "The First Continental Congress wanted **resolution, not independence**."], "read": ["**Seven Years War (1756–1763):** a global conflict, mainly Great Britain against France. It **doubled** Britain's national debt. Part of it was fought in North America, so Britain decided the colonists should bear some of the cost.", "**Sugar Act (1764):** taxes on sugar and molasses imported into the colonies. **Stamp Act (1765):** a tax on all paper documents (legal papers, newspapers, cards). The colonial answer: “**No taxation without representation!**”", "**Declaratory Act (1766):** Parliament restated its right to make laws binding on the colonies “**in all cases whatsoever**.”", "**Boston Tea Party (1773):** civil disobedience. Colonists dumped three shiploads of British tea into Boston Harbor instead of paying the tax on it.", "**Intolerable Acts (1774):** Parliament's punishment. The port of Boston was closed; Massachusetts lost self-government (the Governor's Council was appointed by the king); town meetings were suspended; colonists had to house British soldiers; Crown officials accused of crimes would be tried in London, not Boston.", "**First Continental Congress (1774):** the response to the Intolerable Acts. Its goal was **resolution, not independence**: petitions of grievances sent to the king and Parliament. Britain rejected them and treated the Congress as defiance, sending reinforcements to Boston, seizing arms, and extending trade sanctions to all of New England."], "q": [{"k": "order", "q": "Put the road to the Revolution in order, earliest first.", "items": ["Seven Years War", "Sugar Act", "Stamp Act", "Boston Tea Party", "Intolerable Acts", "First Continental Congress"]}, {"k": "fill", "q": "The Seven Years War _____ Britain's national debt, which is why Parliament turned to taxing the colonies.", "a": ["doubled", "double"]}, {"k": "fill", "q": "The 1766 law in which Parliament claimed the right to bind the colonies “in all cases whatsoever” was the _____ Act.", "a": ["Declaratory"]}, {"k": "fill", "q": "Under the Intolerable Acts, Crown officials accused of crimes were to be tried in _____, not in Boston.", "a": ["London", "England", "Britain", "Great Britain"]}, {"k": "tf", "q": "The First Continental Congress aimed at resolving the dispute with Britain, not at independence.", "a": true, "why": "Resolution, not independence, was the goal. It sent petitions of grievances to the king and Parliament."}, {"k": "pick", "q": "Which of these did the Intolerable Acts do? Pick all that apply.", "opts": [["Closed the port of Boston", true], ["Suspended town meetings", true], ["Required colonists to house British soldiers", true], ["Took away Massachusetts's self-government", true], ["Taxed all paper documents", false], ["Taxed imported sugar and molasses", false], ["Declared Parliament's right to bind the colonies “in all cases whatsoever”", false]]}]}, {"id": "second-cc", "t": "Second Continental Congress", "src": "Lectures 3–4", "core": ["Three things: the wartime de facto government; created the **Continental Army** under **Washington**; adopted the **Declaration of Independence** (July 4, 1776)."], "read": ["Met **May 10, 1775 – March 1, 1781**: the meeting of delegates that served as the **de facto government** at the outset of the Revolutionary War.", "Organized the **Continental Army**, with **George Washington** as commander-in-chief.", "Adopted the **Declaration of Independence** on **July 4, 1776**.", "Produced the **Articles of Confederation** in 1777 (ratified 1781).", "The Declaration: Jefferson drew on “Aristotle, Cicero, Locke, Sidney.” Free men create governments for order and security. After a “**long train of abuses and usurpations**,” the people may **alter or abolish** the government. King George III had violated the contract."], "q": [{"k": "pick", "q": "Which of these did the Second Continental Congress do? Pick all that apply.", "opts": [["Organized the Continental Army", true], ["Adopted the Declaration of Independence", true], ["Served as the de facto wartime government", true], ["Produced the Articles of Confederation", true], ["Met in 1774 in response to the Intolerable Acts", false], ["Wrote the Constitution", false], ["Proposed the Bill of Rights", false]]}, {"k": "fill", "q": "The Second Continental Congress named _____ commander-in-chief of the Continental Army.", "a": ["George Washington", "Washington"]}, {"k": "tf", "q": "The Declaration of Independence was adopted by the First Continental Congress.", "a": false, "why": "The Second Continental Congress adopted it on July 4, 1776. The First (1774) only petitioned."}, {"k": "fill", "q": "The Declaration says the people may overthrow a government after “a long train of _____ and usurpations.”", "a": ["abuses"]}]}, {"id": "articles", "t": "The Articles of Confederation: strengths and weaknesses", "src": "Lecture 4", "core": ["Congress could **not** tax, regulate commerce, raise an army, or enforce its laws. There was **no executive and no judiciary**.", "It could only **requisition** (request) money and troops. **9 of 13** states to pass a law, **all 13** to amend, one vote per state."], "read": ["Written by the Second Continental Congress in **1777**, ratified in **1781**. The “Confederation Congress” governed from 1781 to 1789.", "**What Congress could do:** conduct foreign affairs (ambassadors, treaties, alliances, war and peace); **requisition** (request) money, men, and materials from the states; borrow money; regulate Indian affairs; run a postal system.", "**What Congress could not do:** **tax** citizens; regulate trade and commerce between the states (no uniform currency, tariff wars); **raise an army** or force states to supply troops; **enforce** the Articles (no executive branch).", "More weaknesses: **9 of 13** states to pass a bill; **all 13** to amend (no amendment ever passed); **one vote per state** regardless of population; **no executive and no judiciary**.", "Result: the states stayed almost completely sovereign and obeyed Congress only when they saw fit."], "trap": ["“Requisition” means *request*. Congress could ask the states for money and troops. It couldn't compel them, and it couldn't tax citizens directly."], "q": [{"k": "sort", "q": "Under the Articles of Confederation, what could Congress do?", "buckets": ["Congress could", "Congress could not"], "items": [["Conduct foreign affairs and make treaties", 0], ["Declare war", 0], ["Borrow money", 0], ["Ask the states for money and troops", 0], ["Run a postal system", 0], ["Tax citizens", 1], ["Regulate commerce between the states", 1], ["Raise an army", 1], ["Enforce its own laws", 1]]}, {"k": "fill", "q": "The Articles' term for Congress's formal call on the states for money, men, and materials is a(n) _____.", "a": ["requisition", "requisitions"]}, {"k": "fill", "q": "Passing a bill under the Articles took 9 of the 13 states. Amending the Articles took _____ of the 13.", "a": ["13", "all 13", "all", "thirteen", "all thirteen"]}, {"k": "tf", "q": "The Articles of Confederation created a national executive but no national judiciary.", "a": false, "why": "Neither existed. There was no executive and no judiciary, so nobody could enforce the Articles."}, {"k": "tf", "q": "Under the Articles, each state had one vote in Congress regardless of its population.", "a": true, "why": "One state, one vote. That was one of the listed weaknesses."}]}, {"id": "convention-events", "t": "What events led to the Constitutional Convention?", "src": "Lecture 4", "core": ["**Shays' Rebellion** (armed Massachusetts farmers; the government couldn't respond) and the **Annapolis Convention** (only 5 states came) led to the Constitutional Convention of 1787."], "read": ["**Shays' Rebellion (August 1786 – February 1787):** Massachusetts raised taxes on land. The burden fell on small farmers, and farms were seized for back taxes. Farmers led by **Daniel Shays** opposed the foreclosures by force of arms. It exposed how weak the national government was under the Articles (no power to raise an army).", "**Annapolis Convention (1786):** **Virginia** proposed an interstate conference on the Articles' weaknesses, mainly the lack of trade regulation. Only **5 states** sent delegates (NY, NJ, PA, DE, VA), too few to decide anything. It showed the need for a larger convention.", "→ **Constitutional Convention**, May–September **1787**, Philadelphia. Most delegates agreed the central government had to be strengthened (power to collect taxes, regulate commerce)."], "q": [{"k": "sort", "q": "Two events led to the Constitutional Convention. Which one does each statement describe?", "buckets": ["Shays' Rebellion", "Annapolis Convention"], "items": [["Massachusetts farmers resisted farm foreclosures by force", 0], ["Showed the national government had no army to keep order", 0], ["Only five states sent delegates", 1], ["Proposed by Virginia to discuss the lack of trade regulation", 1], ["Showed that a larger convention was needed", 1]]}, {"k": "fill", "q": "The 1786 conference on the Articles' weaknesses that only five states attended was the _____ Convention.", "a": ["Annapolis"]}, {"k": "fill", "q": "The 1786–87 armed uprising of Massachusetts farmers against foreclosures is called _____ Rebellion.", "a": ["Shays'", "Shays", "Shay's", "Shays's", "Shay"]}, {"k": "tf", "q": "Shays' Rebellion highlighted the national government's lack of power to raise an army under the Articles.", "a": true, "why": "Massachusetts farmers resisted foreclosures by force, and the national government couldn't respond."}]}, {"id": "va-nj", "t": "Virginia Plan vs New Jersey Plan", "src": "Lecture 4", "core": ["**Virginia Plan:** large states, strong national government, **bicameral**, representation by **population** in both houses.", "**New Jersey Plan:** small states, limited national government, **unicameral**, **one vote per state**."], "read": ["**Virginia Plan** (backed by the large states): a **powerful national government** that could veto any state law. A **bicameral** legislature with **proportional** representation: seats in *both* houses based on population. A powerful executive **elected by Congress**. A national judiciary appointed by the **legislature**.", "**New Jersey Plan** (backed by small states such as New Jersey, Delaware, Maryland): a more **limited** national government. A **unicameral** legislature with **equal** representation: one vote per state. A limited executive (no veto) with **multiple heads**, chosen by Congress. A national judiciary appointed by the **executives**."], "q": [{"k": "sort", "q": "Which plan does each feature belong to?", "buckets": ["Virginia Plan", "New Jersey Plan"], "items": [["A legislature with two chambers", 0], ["A legislature with one chamber", 1], ["Representation based on population", 0], ["One vote for each state", 1], ["Backed by the large states", 0], ["Backed by the small states", 1], ["A powerful national government that could veto state laws", 0], ["A limited executive with several heads and no veto", 1]]}, {"k": "fill", "q": "The New Jersey Plan called for a(n) _____ legislature: a single chamber with one vote per state.", "a": ["unicameral"], "x": ["bicameral"]}, {"k": "tf", "q": "Under the Virginia Plan, one house was based on population and the other gave each state an equal vote.", "a": false, "why": "That's the Great Compromise. The Virginia Plan used population in both houses."}, {"k": "fill", "q": "The Virginia Plan called for a(n) _____ legislature: two chambers, with seats in both based on population.", "a": ["bicameral"], "x": ["unicameral"]}]}, {"id": "compromises", "t": "The Great Compromise + Three-Fifths Compromise", "src": "Lecture 4", "core": ["**Great (Connecticut) Compromise:** Senate equal for every state, House by population.", "**Three-Fifths Compromise:** three-fifths of the enslaved population counted for **House seats and direct taxes**."], "read": ["**Great Compromise** (also called the **Connecticut Compromise**): a **bicameral** legislature with a dual system of representation. The **upper house (Senate)** gets **equal** representation from each state. The **lower house (House)** gets **proportional** representation by population. It used pieces of both plans.", "Next question: how do you count population? **Northern** delegates wanted to count only the **free** population. **Southern** delegates wanted the **full** population, enslaved people included.", "**Three-Fifths Compromise:** three-fifths of the enslaved population would count for both **direct taxation** and **representation in the House** (Article I, Section 2, Clause 3)."], "trap": ["Review flagged these as “which statement is FALSE” material. Three-fifths counted for House seats **and** direct taxes, it applied to the House (not the Senate), and it gave enslaved people no vote."], "q": [{"k": "sort", "q": "Which compromise does each statement describe?", "buckets": ["Great Compromise", "Three-Fifths Compromise"], "items": [["Combined the Virginia and New Jersey Plans", 0], ["Settled the fight between large and small states", 0], ["Two chambers, each with its own rule of representation", 0], ["Settled a North–South fight over how to count population", 1], ["Counted part of the enslaved population toward House seats", 1], ["Also applied to direct taxation", 1]]}, {"k": "fill", "q": "The Great Compromise is also known as the _____ Compromise.", "a": ["Connecticut"]}, {"k": "tf", "q": "The Three-Fifths Compromise counted three-fifths of the enslaved population for House representation but not for direct taxation.", "a": false, "why": "It counted for both: direct taxation and representation in the House."}, {"k": "sort", "q": "In the fight over counting population, who wanted what?", "buckets": ["Northern delegates", "Southern delegates"], "items": [["Count only the free population", 0], ["Count the full population, enslaved people included", 1], ["Stood to gain House seats if enslaved people were counted", 1]]}, {"k": "fill", "q": "Under the Great Compromise, every state has equal representation in the _____.", "a": ["Senate", "upper house"]}]}, {"id": "fed-antifed", "t": "What did the Federalists and Anti-Federalists argue?", "src": "Lecture 4", "core": ["**Federalists** (Madison, Hamilton, Jay): for ratification, a stronger national government, a large republic.", "**Anti-Federalists:** against ratification; feared for **individual liberties and state power**; wanted a small republic."], "read": ["The Constitution was signed **September 17, 1787**. The ratification fight ran from September 1787 to June 1788.", "**Federalists:** supporters of a stronger national government who favored ratification. They argued the Constitution would prevent (1) **oppressive government**, through limited and enumerated powers, separation of powers, and checks and balances; and (2) **tyranny of the majority**, by creating an “**extensive republic**.” Leaders: **James Madison, Alexander Hamilton, John Jay**.", "**Anti-Federalists:** opponents of a stronger national government who generally opposed ratification. They feared the proposed national government was too powerful to leave **individual liberties and state autonomy** secure. Leaders: **Patrick Henry, George Mason, Melancton Smith, Robert Yates, Samuel Adams**.", "On size: Federalists wanted a **large** republic; Anti-Federalists wanted a **small** one.", "The TA's framing: Federalists feared a government too weak to act. Anti-Federalists feared one strong enough to threaten liberty and overpower the states."], "q": [{"k": "sort", "q": "Federalist or Anti-Federalist?", "buckets": ["Federalists", "Anti-Federalists"], "items": [["Favored ratifying the Constitution", 0], ["Opposed ratification", 1], ["Wanted a large, extensive republic", 0], ["Wanted a small republic", 1], ["Feared for individual liberties and state autonomy", 1], ["Said limited powers and checks and balances would prevent oppressive government", 0], ["Patrick Henry and George Mason", 1], ["James Madison and Alexander Hamilton", 0]]}, {"k": "pick", "q": "What did the Anti-Federalists fear about the proposed Constitution? Pick all that apply.", "opts": [["A national government too powerful to leave individual liberties secure", true], ["The loss of state autonomy", true], ["A national government too weak to act", false], ["Too much power left with the state legislatures", false], ["Rule by a pure democracy", false]]}, {"k": "tf", "q": "It was the Federalists, not the Anti-Federalists, who argued for the benefits of a large republic.", "a": true, "why": "The large-republic case is Federalist 10. Anti-Federalists wanted small republics."}, {"k": "fill", "q": "The three leading Federalists were James Madison, Alexander Hamilton, and John _____.", "a": ["Jay"]}]}, {"id": "sep-checks", "t": "Separation of Powers vs Checks and Balances", "src": "Lectures 3–5, 11", "core": ["Separation of powers is the **division** into three branches. Checks and balances are the **tools** each branch uses against the others. They are not the same thing."], "read": ["**Separation of powers:** dividing government power among distinct branches (legislative, executive, judicial). Montesquieu's idea.", "**Checks and balances:** the *tools* each branch has to resist the others and keep them “in their proper places”: veto, override, confirmation, impeachment, judicial review.", "They are two different ideas. Federalist 51's point is that checks and balances are **how** the separation of powers is *maintained*."], "trap": ["The professor stressed that these are different things: the division into branches versus the tools that keep each branch in its place."], "q": [{"k": "sort", "q": "Separation of powers, or checks and balances?", "buckets": ["Separation of powers", "Checks and balances"], "items": [["Dividing government into three branches", 0], ["Each branch holds a different kind of power", 0], ["The principle Montesquieu said best preserves liberty", 0], ["The president's veto", 1], ["Judicial review", 1], ["Congress overriding a veto", 1], ["Impeachment", 1], ["The tools that keep each branch in its proper place", 1]]}, {"k": "tf", "q": "“Separation of powers” and “checks and balances” are two names for the same principle.", "a": false, "why": "Separation is the division into branches. Checks are the tools that let each branch resist the others."}, {"k": "fill", "q": "The Senate's power to reject a president's nominee is an example of which principle, separation of powers or checks and balances? _____", "a": ["checks and balances", "checks", "checks & balances"]}]}, {"id": "bicameralism", "t": "What is bicameralism?", "src": "Lecture 5", "core": ["Two chambers. **House:** originates revenue bills; impeaches. **Senate:** confirms appointments, approves treaties, tries impeachments. A bill must pass both."], "read": ["**Bicameralism** = a legislature with two chambers. Federalist 51 treats it as **separation of powers *within* the legislature**: in a republic “the legislative authority necessarily predominates,” so divide it into branches with “different modes of election and different principles of action.”", "**House of Representatives:** the only chamber that can **originate revenue** legislation. It has the “**sole power of impeachment**” (Article I, Section 2).", "**Senate:** sole power to **confirm** presidential appointments (Cabinet, federal judges, ambassadors) and to approve **treaties**. It has the “sole power to **try** all impeachments” (Article I, Section 3).", "A bill must pass **both** chambers before it becomes law."], "trap": ["The House *originates* revenue bills. That doesn't mean it passes them alone: the Senate still has to pass them. The professor said students get this wrong."], "q": [{"k": "fill", "q": "Only the House can _____ revenue bills.", "a": ["originate", "introduce", "initiate", "start"]}, {"k": "sort", "q": "Which chamber holds each power?", "buckets": ["House only", "Senate only"], "items": [["Starts revenue bills", 0], ["Impeaches: brings the charges", 0], ["Tries impeachments", 1], ["Confirms presidential appointments", 1], ["Approves treaties", 1]]}, {"k": "tf", "q": "A revenue bill becomes law once the House passes it, with no action by the Senate.", "a": false, "why": "The House originates revenue bills, but every bill must pass both chambers."}, {"k": "open", "q": "Why does Madison want the legislature split into two chambers?", "a": "In a republic the legislature naturally predominates. Splitting it, with different modes of election and principles of action, is separation of powers inside the legislature."}]}, {"id": "fed51", "t": "Federalist 51: maintaining separation of powers; the “double security”", "src": "Lectures 4–5", "core": ["Madison. The separation of powers is maintained by **checks and balances**: “**ambition must be made to counteract ambition**.”", "**Double security:** power is split between the national and state governments (federalism), then among the branches of each."], "read": ["**James Madison, 1788.** The question: how do we *maintain* the separation of powers? The answer: **checks and balances**, “so contriving the interior structure of the government” that its parts keep “each other in their proper places.”", "Human nature is driven by **ambition**, and ambition leads to encroachments on power. So each branch gets “the necessary **constitutional means and personal motives** to resist encroachments.”", "“**Ambition must be made to counteract ambition.**” “**If men were angels, no government would be necessary.**”", "The legislature predominates in a republic, so it is divided in two (bicameralism).", "**Double security:** in the “**compound republic** of America,” power is first divided between **two distinct governments** (national and state: federalism), and then each portion is subdivided among **separate departments** (the branches). “Hence a double security arises to the rights of the people.”"], "trap": ["The double security is **federalism plus separation of powers**: two levels of government, then branches within each. It is not bicameralism."], "q": [{"k": "open", "q": "According to Madison, how can the separation of powers be maintained?", "a": "By checks and balances: give each branch the constitutional means and the personal motives to resist encroachments by the others. Ambition counteracts ambition."}, {"k": "open", "q": "How does federalism provide a “double security”? Name the two layers.", "a": "Layer 1: power is divided between two governments, national and state.\nLayer 2: each government's share is divided among separate branches.\nThe governments control each other, and each is controlled by itself."}, {"k": "fill", "q": "Federalist 51: “If men were _____, no government would be necessary.”", "a": ["angels"]}, {"k": "fill", "q": "Federalist 51 calls America a “_____ republic”: power is first divided between two governments, then among the departments of each.", "a": ["compound"]}, {"k": "tf", "q": "The “double security” of Federalist 51 refers to having two chambers of Congress.", "a": false, "why": "It's federalism (two levels of government) plus separation of powers (branches within each)."}, {"k": "fill", "q": "Madison's premise in Federalist 51: human nature is driven by _____, so each branch will try to encroach on the others.", "a": ["ambition"]}]}, {"id": "fed10", "t": "Federalist 10: factions; republic over democracy; large republic over small", "src": "Lecture 5", "core": ["A **faction** is a group of citizens, a majority *or* a minority, united by a passion or interest **adverse to others' rights**.", "Its causes can't be removed, so **control its effects**. A **republic** beats a pure democracy because representatives refine the public's views.", "A **large** republic beats a small one: better candidates win, more interests means no oppressive majority, and bad ideas don't spread."], "read": ["**James Madison, 1787.** A **faction** is “a number of citizens, whether amounting to a **majority or a minority** of the whole, who are united and actuated by some common impulse of passion, or of interest, **adversed to the rights of other citizens**, or to the permanent and aggregate interests of the community.”", "Two ways to cure faction: **remove its causes** or **control its effects**. Removing causes means (1) destroying liberty, a remedy “worse than the disease,” or (2) giving everyone the same opinions, which is “impracticable.” So the task is to control the effects.", "A **minority** faction is easy: the **republican principle** lets the majority defeat it by regular vote. The real danger is a **majority** faction.", "A **pure democracy** (a small number of citizens who assemble and govern in person) “can admit of no cure” for a majority faction.", "**Republic over democracy:** representatives “**refine and enlarge** the public views” by passing them through a chosen body of citizens who can discern the true interest of the country.", "**Large republic over small**, three arguments. (1) **More voters per representative**, so unworthy candidates find it harder to win by “vicious arts” and better candidates win. (2) **More parties and interests** (“extend the sphere”), so an oppressive majority is less likely to form. (3) **More territory**, so factious leaders “may kindle a flame within their particular States” but can't spread “a general conflagration.”"], "trap": ["A faction can be a majority *or* a minority. What makes it a faction is its adverse aim, not its size."], "q": [{"k": "open", "q": "Define a faction the way Madison does.", "a": "A number of citizens, a majority or a minority, united by a common passion or interest that is adverse to the rights of other citizens or to the permanent interests of the community."}, {"k": "open", "q": "Why is a republic better than a pure democracy at handling faction?", "a": "A pure democracy has no cure for a majority faction.\nIn a republic, representatives refine and enlarge the public views and can discern the true public interest."}, {"k": "pick", "q": "Which of these are Madison's arguments in Federalist 10 for a large republic? Pick all that apply.", "opts": [["More voters per representative, so better candidates win", true], ["More parties and interests, so an oppressive majority is less likely to form", true], ["More territory, so dangerous ideas don't spread across the whole Union", true], ["Citizens are alike enough to agree on the public good", false], ["Representatives closely resemble the people they represent", false], ["People obey the laws willingly, without force", false]]}, {"k": "tf", "q": "By Madison's definition, a faction can be a majority of the citizens as well as a minority.", "a": true, "why": "“Whether amounting to a majority or a minority of the whole.” The majority faction is the dangerous one."}, {"k": "fill", "q": "Madison says a republic can “_____ and enlarge the public views” by passing them through a chosen body of citizens.", "a": ["refine"]}, {"k": "fill", "q": "Madison concludes that the causes of faction cannot be removed, so government must control its _____.", "a": ["effects"]}, {"k": "tf", "q": "Madison's preferred cure for faction is to give every citizen the same opinions and interests.", "a": false, "why": "He calls that impracticable. Destroying liberty is worse than the disease. His answer is to control the effects with a large republic."}]}, {"id": "brutus", "t": "Brutus No. 1: the two clauses, the taxing power, and the state legislatures", "src": "Lectures 5–6", "core": ["Anti-Federalist. The **Necessary and Proper Clause** (Art. I, §8) and the **Supremacy Clause** (Art. VI) give the federal government unlimited power.", "The taxing power is too extreme because **Congress alone decides** what “common defence and general welfare” mean.", "The states lose their revenue, **dwindle away**, and the country becomes one consolidated government."], "read": ["**Brutus No. 1 (1787)**, an Anti-Federalist essay. It attacks two clauses.", "**Necessary and Proper Clause** (Article I, Section 8): Congress may make laws “necessary and proper” for executing its enumerated powers. Brutus: this gives the federal government “**absolute and uncontrollable power**.” Congress could “annihilate all the state governments, and reduce this country to **one single government**.”", "**Supremacy Clause** (Article VI, Clause 2): federal law takes precedence over any conflicting state law. Brutus: state constitutions and laws are “**nullified and declared void**” wherever they conflict, so the new government is “a complete one, and not a confederation.”", "**Why the taxing power is too extreme:** the power to tax is “the most important of any power”; it “connects with it almost all other powers.” The only stated limit is that taxes serve the “**common defence and general welfare**.” But **Congress is the sole judge** of what those words mean, so it's no limit at all.", "**How the state legislatures get abolished:** federal taxes will leave the states unable to raise money. “Without money they cannot be supported, and they must **dwindle away**.” Congress could also repeal a state tax law as getting in the way of a federal tax it thinks “proper and necessary.”"], "q": [{"k": "sort", "q": "Which clause is Brutus talking about?", "buckets": ["Necessary and Proper Clause", "Supremacy Clause"], "items": [["Lets Congress make laws to carry out its listed powers", 0], ["Gives the federal government “absolute and uncontrollable power”", 0], ["The source of implied powers", 0], ["Makes federal law override conflicting state law", 1], ["State constitutions and laws are “nullified and declared void”", 1]]}, {"k": "open", "q": "Why is the federal power to tax too extreme, according to Brutus?", "a": "Taxing is the most important power and connects to almost all others.\nIts only limit is “common defence and general welfare,” and Congress alone judges what those mean. So it has no real limit."}, {"k": "open", "q": "How might the Constitution abolish the state legislatures, according to Brutus?", "a": "Federal taxes drain the tax base, so states can't raise money and “dwindle away.”\nCongress could repeal state laws that interfere with federal taxes, using Necessary and Proper plus Supremacy. The end is one single consolidated government."}, {"k": "fill", "q": "The Supremacy Clause is found in Article _____ of the Constitution.", "a": ["VI", "6", "six"]}, {"k": "fill", "q": "Brutus says “common defence” and “general welfare” don't limit the taxing power, because _____ is the sole judge of what they mean.", "a": ["Congress", "the legislature"]}, {"k": "tf", "q": "Brutus warned that Congress could use the Necessary and Proper Clause to annihilate the state governments.", "a": true, "why": "He said the clause gives “absolute and uncontrollable power” and could reduce the country to one single government."}, {"k": "fill", "q": "The Necessary and Proper Clause is in Article I, Section _____.", "a": ["8", "eight"]}]}, {"id": "storing", "t": "Storing (chs. 3 & 5): the Anti-Federalist case for a small republic", "src": "Lecture 6", "core": ["A small republic gives three things: **voluntary attachment** to the government and its laws; genuine **responsibility** (representatives resemble the people); and the right kind of **citizens** (civic virtue, a homogeneous people)."], "read": ["Herbert Storing, *What the Anti-Federalists Were For*, chapter 3. **Three benefits of a small republic:**", "**1. Voluntary attachment** of the people to the government and voluntary obedience to the laws. A free people should support its laws “without an expensive military force” (the Federal Farmer). In a large republic the people will “have no confidence in their legislature.”", "**2. Genuine responsibility** of the government to the people. That takes a **likeness** between representatives and citizens: “the same interests, feelings, opinions, and views.” Federal elections only offer a choice among “the well-known few.”", "**3. It forms the kind of citizens** who can maintain republican government. That depends on **civic virtue** and a citizenry that is free, independent-minded, and **homogeneous**, with similar “manners, sentiments, and interests.” Homogeneity is only found in small communities: the individual states.", "The contrast with Federalist 10: Madison wants a *large and diverse* republic; the Anti-Federalists want a *small and homogeneous* one.", "Chapter 5 (“The Federalist Reply”) is reading only. The study-guide question is the chapter 3 benefits."], "q": [{"k": "pick", "q": "Which of these are the Anti-Federalists' benefits of a small republic? Pick all that apply.", "opts": [["The people are voluntarily attached to the government and obey its laws willingly", true], ["The government is genuinely responsible to the people", true], ["It forms citizens with the civic virtue a republic needs", true], ["More competing interests make an oppressive majority unlikely", false], ["Representatives refine and enlarge the public's views", false], ["Unworthy candidates find it harder to win elections", false]]}, {"k": "fill", "q": "Anti-Federalists said genuine responsibility requires a(n) _____ between the representative body and the citizens at large.", "a": ["likeness", "similarity", "resemblance"]}, {"k": "tf", "q": "The Anti-Federalists thought a republic works best when its citizens differ widely in manners, sentiments, and interests.", "a": false, "why": "They wanted a homogeneous citizenry. Diversity as protection is Madison's argument in Federalist 10."}, {"k": "fill", "q": "A citizenry whose manners, sentiments, and interests are all similar is what the Anti-Federalists called _____.", "a": ["homogeneous", "homogenous"]}]}, {"id": "bill-of-rights", "t": "Bill of Rights", "src": "Lecture 6", "core": ["The **first ten amendments**: the compromise that answered the Anti-Federalists. It protects individual rights from the **national** government."], "read": ["The **compromise** that settled ratification: the **first ten amendments**, intended to protect **individual rights and liberties from action by the new national government**. It answered the Anti-Federalists' central objection.", "The Constitution was **ratified June 21, 1788**, when **9 of 13** states had approved it. It became legally effective **March 4, 1789**."], "trap": ["Don't swap the two compromises. **Bill of Rights** = the ratification deal with the Anti-Federalists. **Great Compromise** = how the House and Senate are apportioned."], "q": [{"k": "fill", "q": "The compromise that answered Anti-Federalist fears about individual liberties was the _____.", "a": ["Bill of Rights"]}, {"k": "tf", "q": "The Bill of Rights was originally intended to protect individual rights from the new national government, not from the states.", "a": true, "why": "It was aimed at the national government, to answer the Anti-Federalists."}, {"k": "fill", "q": "The Constitution was ratified once _____ of the 13 states had approved it.", "a": ["9", "nine"]}, {"k": "open", "q": "What was the Bill of Rights for, and whose objection did it answer?", "a": "The first ten amendments: protect individual rights and liberties from the new national government.\nIt answered the Anti-Federalists, which made ratification possible."}]}, {"id": "checks-chart", "t": "What are the various checks and balances in the federal government?", "src": "Lecture 11", "core": ["**President:** veto; appoints judges; pardons.", "**Congress:** override a veto, impeach, reject appointments and treaties, the **power of the purse**, propose amendments to overrule the courts.", "**Courts:** judicial review."], "read": ["**Executive on legislative:** the veto.", "**Executive on judicial:** appoints federal judges; the pardon power.", "**Judicial on executive:** judicial review. **Judicial on legislative:** judicial review.", "**Legislative on executive:** reject appointments; reject treaties; the **power of the purse** (withhold funding for presidential initiatives); override a veto; impeachment.", "**Legislative on judicial:** reject appointments; impeachment; **propose constitutional amendments** to overrule judicial decisions."], "trap": ["Expect match-the-check questions. Note where the pardon sits on the slide: it's an executive check on the **judicial** branch."], "q": [{"k": "pick", "q": "Which of these are Congress's checks on the president? Pick all that apply.", "opts": [["Rejecting appointments", true], ["Rejecting treaties", true], ["Withholding funding", true], ["Overriding a veto", true], ["Impeachment", true], ["Striking down an executive action as unconstitutional", false], ["The pardon", false], ["Appointing federal judges", false]]}, {"k": "pick", "q": "Which of these are Congress's checks on the courts? Pick all that apply.", "opts": [["Rejecting judicial nominees", true], ["Impeaching judges", true], ["Proposing constitutional amendments to overrule decisions", true], ["Vetoing a court's ruling", false], ["Pardoning those the courts convict", false], ["Striking down a law as unconstitutional", false]]}, {"k": "sort", "q": "Whose check is it?", "buckets": ["President on Congress", "President on the courts", "Courts on the other two"], "items": [["The veto", 0], ["Appointing federal judges", 1], ["The pardon power", 1], ["Striking down a law or executive action as unconstitutional", 2]]}, {"k": "tf", "q": "On the lecture's chart, the pardon power is an executive check on the legislative branch.", "a": false, "why": "It's listed as an executive check on the judicial branch. The check on the legislature is the veto."}, {"k": "fill", "q": "Congress's ability to withhold funding from a president's initiatives is called the power of the _____.", "a": ["purse"]}, {"k": "fill", "q": "The judiciary's check on both Congress and the president is judicial _____.", "a": ["review"]}]}, {"id": "amending", "t": "What is the standard process for amending the U.S. Constitution?", "src": "Lecture 11", "core": ["Proposed by **two-thirds** of both houses of Congress. Ratified by **three-fourths** of the state legislatures."], "read": ["The **most common route** has two steps. **Proposal:** Congress proposes an amendment by a **two-thirds** vote in **both** the House and the Senate. **Ratification:** **three-fourths of the state legislatures** approve it.", "Where it shows up elsewhere: amendments are Congress's check on judicial decisions, and they're the only way to change the qualifications for serving in Congress."], "q": [{"k": "fill", "q": "On the standard route, Congress proposes an amendment by a(n) _____ vote in both the House and the Senate.", "a": ["two-thirds", "2/3", "two thirds", "⅔", "2/3rds"]}, {"k": "fill", "q": "A proposed amendment must then be approved by _____ of the state legislatures.", "a": ["three-fourths", "3/4", "three fourths", "¾", "three-quarters", "three quarters", "3/4ths"]}, {"k": "tf", "q": "On the standard route, an amendment is proposed by the state legislatures and ratified by Congress.", "a": false, "why": "The reverse. Congress proposes (two-thirds of both houses) and the state legislatures ratify (three-fourths)."}]}]}, {"id": "II", "title": "Federalism", "blurb": "Lectures 6–7. Who holds which powers, what the states owe each other, and how the model changed in the 1930s.", "items": [{"id": "systems", "t": "Federal vs Unitary vs Confederate government systems", "src": "Lecture 6", "core": ["**Federal:** power divided between national and state governments (US). **Unitary:** one central authority (UK, France). **Confederate:** sovereign states hand a few powers to a weak center (the Articles, the EU)."], "read": ["**Federalism:** a form of government in which some powers are assigned to the national government, some to subnational governments, and some are exercised **concurrently**. Examples: USA, Canada, Mexico, Germany, India.", "**Unitary government:** supreme governing authority is concentrated in a single, central national authority. Examples: UK, France, China, Japan, Israel, Egypt.", "**Confederate government:** a union of independent, sovereign states that delegate limited, specific powers to a central authority. Examples: the US under the Articles of Confederation, the EU.", "**Strengths of federalism:** limits concentrated national power; encourages innovation by the states; encourages citizen involvement; national minorities may be subnational majorities.", "**Weaknesses:** leaves state power vulnerable; complex overlapping responsibilities; lack of uniformity; encourages a race to the bottom."], "q": [{"k": "sort", "q": "Federal, unitary, or confederate?", "buckets": ["Federal", "Unitary", "Confederate"], "items": [["The United States today", 0], ["Canada", 0], ["Germany", 0], ["India", 0], ["The United Kingdom", 1], ["France", 1], ["Japan", 1], ["China", 1], ["The US under the Articles", 2], ["The European Union", 2]]}, {"k": "fill", "q": "A system in which supreme governing authority is concentrated in a single, central national government is a(n) _____ government.", "a": ["unitary"]}, {"k": "fill", "q": "A union of independent, sovereign states that delegate only limited, specific powers to a central authority is a(n) _____ government.", "a": ["confederate", "confederal", "confederation"]}, {"k": "tf", "q": "“National minorities may be subnational majorities” is one of the listed strengths of federalism.", "a": true, "why": "It's on the strengths side, with limiting national power, state innovation, and citizen involvement."}, {"k": "sort", "q": "Strength or weakness of federalism?", "buckets": ["Strength", "Weakness"], "items": [["Limits concentrated national power", 0], ["Encourages innovation by the states", 0], ["Encourages citizen involvement", 0], ["National minorities may be subnational majorities", 0], ["Leaves state power vulnerable", 1], ["Complex, overlapping responsibilities", 1], ["Lack of uniformity", 1], ["Encourages a race to the bottom", 1]]}]}, {"id": "power-types", "t": "Enumerated Powers, Implied Powers, Inherent Powers", "src": "Lecture 6", "core": ["**Enumerated:** listed in Article I, Section 8. **Implied:** from the Necessary and Proper Clause (IRS, the draft). **Inherent:** any sovereign nation has them (immigration, acquiring territory)."], "read": ["**Enumerated powers:** the powers of Congress specifically listed in **Article I, Section 8** (seventeen of them): tax, regulate commerce, raise armies and navies, declare war, and so on.", "**Implied powers:** congressional powers not specifically listed, but “reasonable and necessary to accomplish an enumerated end or activity.” Their source is the **Necessary and Proper Clause**. Examples: the **IRS**, the military **draft**, the Social Security system, the Interstate Highway System, regulating air travel.", "**Inherent powers:** powers a sovereign nation has that **do not depend on constitutional text**; they exist simply because the country is a sovereign state. Examples: emergency powers during war, controlling **immigration**, developing intelligence agencies, **acquiring territory**.", "From the reading, not lecture: ***McCulloch v. Maryland* (1819)** used the Necessary and Proper Clause to uphold the national bank, backing a broad view of implied powers."], "trap": ["The classic pairing: the Necessary and Proper Clause is the source of **implied** powers."], "q": [{"k": "sort", "q": "Enumerated, implied, or inherent?", "buckets": ["Enumerated", "Implied", "Inherent"], "items": [["The power to tax", 0], ["The power to declare war", 0], ["Regulating commerce", 0], ["The IRS", 1], ["The military draft", 1], ["The Social Security system", 1], ["Controlling immigration", 2], ["Acquiring territory", 2], ["Emergency powers in wartime", 2]]}, {"k": "fill", "q": "Building the Interstate Highway System, which the Constitution never lists but which helps carry out powers it does list, is an example of a(n) _____ power.", "a": ["implied"]}, {"k": "fill", "q": "Developing intelligence agencies, which comes from nationhood and not from any constitutional text, is a(n) _____ power.", "a": ["inherent"]}, {"k": "tf", "q": "The enumerated powers of Congress are listed in Article II, Section 2.", "a": false, "why": "Article I, Section 8. Article II is the presidency."}, {"k": "fill", "q": "Implied powers rest on the _____ Clause of Article I, Section 8.", "a": ["Necessary and Proper", "Necessary & Proper", "elastic"]}]}, {"id": "nat-state", "t": "National Powers vs State Powers", "src": "Lectures 6–7", "core": ["**National:** print money, declare war, foreign policy, **interstate** commerce. **State:** conduct elections, ratify amendments, local governments, **intrastate** commerce."], "read": ["**National powers:** print money; declare war and provide national defense; conduct foreign policy; regulate **interstate and foreign** commerce; admit new states; regulate the mail.", "**Concurrent powers:** collect taxes; make and enforce laws; establish courts; charter corporations; exercise eminent domain; borrow money.", "**State powers:** **ratify constitutional amendments**; **conduct elections**; establish local governments; regulate **intrastate** commerce; reserved powers such as police powers."], "q": [{"k": "sort", "q": "National, concurrent, or state power?", "buckets": ["National", "Concurrent", "State"], "items": [["Print money", 0], ["Declare war", 0], ["Admit new states", 0], ["Conduct foreign policy", 0], ["Collect taxes", 1], ["Establish courts", 1], ["Borrow money", 1], ["Conduct elections", 2], ["Establish local governments", 2], ["Ratify constitutional amendments", 2]]}, {"k": "tf", "q": "In the Constitution's distribution of powers, conducting elections is a national power.", "a": false, "why": "It's a state power on the lecture's chart."}, {"k": "fill", "q": "The national government regulates interstate commerce; the states regulate _____ commerce.", "a": ["intrastate"], "x": ["interstate", "inter-state"]}, {"k": "tf", "q": "Both the national government and the states may establish courts.", "a": true, "why": "Establishing courts is on the concurrent list."}]}, {"id": "concurrent", "t": "Concurrent Powers", "src": "Lectures 6–7", "core": ["Powers **both** levels hold at once: **taxing**, borrowing, making and enforcing laws, establishing courts."], "read": ["**Concurrent powers:** powers available to **both** levels of government in a federal system, which both may exercise **simultaneously**.", "The list: collect taxes; make and enforce laws; establish courts; charter corporations; exercise eminent domain; borrow money."], "trap": ["A state income tax is a **concurrent** power, not a reserved one: both levels tax. The recitation room missed this one."], "q": [{"k": "fill", "q": "Powers that the national and state governments may both exercise at the same time are _____ powers.", "a": ["concurrent"]}, {"k": "tf", "q": "When a state collects an income tax, it is using a reserved power.", "a": false, "why": "Taxing is concurrent: both the national government and the states do it."}, {"k": "pick", "q": "Which of these are concurrent powers? Pick all that apply.", "opts": [["Collecting taxes", true], ["Borrowing money", true], ["Establishing courts", true], ["Exercising eminent domain", true], ["Printing money", false], ["Conducting elections", false], ["Declaring war", false], ["Ratifying constitutional amendments", false]]}]}, {"id": "reserved", "t": "Reserved Powers (powers reserved to the states)", "src": "Lecture 7", "core": ["The **Tenth Amendment** reserves undelegated powers to the states. The big one is the **police powers**: laws for public health, safety, morals, and welfare."], "read": ["**Tenth Amendment:** “The powers not delegated to the United States by the Constitution, nor prohibited by it to the states, are reserved to the states respectively, or to the people.”", "Reserved powers fall into three categories. **(1) Police powers:** the authority of state governments to enact laws for the public good (public **safety, health, morals, general welfare**). **(2) Provision of services** to citizens: education, police, fire departments. **(3) Creation and control of local governments.**"], "trap": ["“Which of these is NOT a reserved power?” is a likely question. Taxing and borrowing are concurrent, so they don't count. Running elections came up in recitation as a state power the room missed."], "q": [{"k": "fill", "q": "The amendment that reserves undelegated powers to the states or to the people is the _____ Amendment.", "a": ["Tenth", "10th", "10"]}, {"k": "fill", "q": "A state's broad authority to pass laws for public safety, health, and morals is called its _____ powers.", "a": ["police"]}, {"k": "pick", "q": "Which of these are categories of reserved powers? Pick all that apply.", "opts": [["Police powers", true], ["Providing services such as education, police, and fire protection", true], ["Creating and controlling local governments", true], ["Coining money", false], ["Regulating interstate commerce", false], ["Making treaties", false]]}, {"k": "tf", "q": "The Tenth Amendment reserves to the states only those powers the Constitution lists for them by name.", "a": false, "why": "It reserves everything not delegated to the United States and not prohibited to the states. No list."}]}, {"id": "denied", "t": "Powers Denied to the States", "src": "Lecture 7", "core": ["Article I, Section 10: states can't make **treaties**, **coin money**, **tax imports or exports**, wage war (unless invaded), or impair contracts."], "read": ["**Article I, Section 10** forbids the states to: enter into **treaties or alliances**, with each other or with foreign powers; engage in **war** unless actually invaded; **coin** their own money; **tax imports or exports**; **impair contracts**."], "q": [{"k": "pick", "q": "Which of these does the Constitution forbid the states to do? Pick all that apply.", "opts": [["Make treaties or alliances", true], ["Coin money", true], ["Tax imports or exports", true], ["Impair contracts", true], ["Collect taxes", false], ["Borrow money", false], ["Establish courts", false], ["Conduct elections", false]]}, {"k": "tf", "q": "A state may coin its own money as long as Congress doesn't object.", "a": false, "why": "Coining money is flatly denied to the states by Article I, Section 10."}, {"k": "fill", "q": "The powers denied to the states are listed in Article I, Section _____.", "a": ["10", "ten"]}, {"k": "tf", "q": "A state may engage in war if it is actually invaded.", "a": true, "why": "The ban on state war-making has that one exception."}]}, {"id": "guarantee", "t": "Guarantee Clause", "src": "Lecture 7", "core": ["Article IV, Section 4: the federal government guarantees every state a **republican form of government**, and protects it from invasion and domestic violence."], "read": ["**Guarantee Clause** (Article IV, Section 4): the federal government must (1) guarantee each state a **republican form of government**, (2) protect each state from **foreign invasion**, and (3) protect each state from **domestic violence**, *upon request*.", "Also promised (Article V): a state's boundaries and its **equal representation in the Senate** can't be changed without its consent."], "q": [{"k": "fill", "q": "The Guarantee Clause promises every state a(n) _____ form of government.", "a": ["republican"]}, {"k": "pick", "q": "What does the Guarantee Clause require of the federal government? Pick all that apply.", "opts": [["Guarantee each state a republican form of government", true], ["Protect each state from foreign invasion", true], ["Protect each state from domestic violence, on request", true], ["Enforce one state's court judgments in another", false], ["Return fugitives to the state that charged them", false], ["Make each state treat other states' citizens fairly", false]]}, {"k": "tf", "q": "The Guarantee Clause is found in Article IV of the Constitution.", "a": true, "why": "Article IV, Section 4."}]}, {"id": "interstate", "t": "Relations among the states: Full Faith and Credit, Privileges and Immunities, Extradition", "src": "Lecture 7", "core": ["**Full Faith and Credit:** honor other states' records and court judgments. **Privileges and Immunities:** treat other states' citizens fairly. **Extradition:** send fugitives back."], "read": ["**Full Faith and Credit Clause** (Article IV, Section 1): states must recognize the **public acts, records, and court decisions** of other states. Examples: driver's licenses, marriages and divorce decrees, court judgments.", "**Privileges and Immunities Clause** (Article IV, Section 2): states must **deal fairly with each other's citizens**. Examples: the right to protection, to travel, to work, and access to courts.", "**Extradition Clause** (Article IV, Section 2): a person charged with a crime in one state who flees to another must be **returned**, on demand of the governor of the state they fled."], "trap": ["The pair people confuse: **Full Faith and Credit** is about a state's *documents and judgments*. **Privileges and Immunities** is about how a state treats *people from other states*."], "q": [{"k": "fill", "q": "A final court judgment from one state must be honored in another because of the _____ Clause.", "a": ["Full Faith and Credit", "Full Faith & Cre
