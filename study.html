dit"]}, {"k": "fill", "q": "A state that bars citizens of other states from ordinary private-sector jobs runs into the _____ Clause.", "a": ["Privileges and Immunities", "Privileges & Immunities"]}, {"k": "fill", "q": "Sending a fugitive back to the state where he is charged is required by the _____ Clause.", "a": ["Extradition"]}, {"k": "sort", "q": "Which Article IV clause covers each situation?", "buckets": ["Full Faith and Credit", "Privileges and Immunities", "Extradition"], "items": [["A driver's license from one state is valid in the others", 0], ["A marriage or divorce is recognized in other states", 0], ["A court judgment is enforced in another state", 0], ["An out-of-state citizen's right to work", 1], ["An out-of-state citizen's right to travel and use the courts", 1], ["Sending back an accused person who fled to another state", 2]]}, {"k": "tf", "q": "The Full Faith and Credit, Privileges and Immunities, and Extradition Clauses are all in Article IV.", "a": true, "why": "Section 1 (Full Faith and Credit) and Section 2 (the other two)."}]}, {"id": "dual-coop", "t": "Dual Federalism vs Cooperative Federalism. What led to the shift?", "src": "Lecture 7", "core": ["**Dual federalism:** separate spheres (until the 1930s). **Cooperative federalism:** shared responsibilities (since).", "The cause of the shift: the **Great Depression** and FDR's **New Deal**."], "read": ["**Dual federalism (1789–1930s):** the two levels of government were sovereign in fairly **distinct** areas of responsibility, with little overlap or shared authority (the “layer cake”). Education, health care, welfare, labor laws, intrastate commerce, immigration, and slavery laws were traditionally left to state and local governments.", "**Cooperative federalism (after the 1930s):** national, state, and local governments **share responsibility** for virtually all functions (the “marble cake”). Officials are now “colleagues, not adversaries.”", "**What led to the shift:** the **Great Depression**. State and local governments were in crisis, and **FDR's New Deal** expanded federal authority over the nation's economy. Examples: the **Fair Labor Standards Act** (minimum wage), the **National Labor Relations Act** (protects labor organizing), the **Social Security Act** (pensions, unemployment insurance, welfare). That legislation and related Supreme Court decisions ended dual federalism."], "trap": ["Easy swap on a multiple-choice question: the New Deal laws are **FDR's** (Fair Labor Standards, National Labor Relations, Social Security). Medicare and Medicaid are LBJ's Great Society, later."], "q": [{"k": "sort", "q": "Dual or cooperative federalism?", "buckets": ["Dual federalism", "Cooperative federalism"], "items": [["Each level is sovereign in its own separate sphere", 0], ["The “layer cake”", 0], ["Dominant from 1789 to the 1930s", 0], ["All levels share responsibility for nearly every function", 1], ["The “marble cake”", 1], ["Took over after the 1930s", 1], ["Officials are colleagues, not adversaries", 1]]}, {"k": "fill", "q": "The 1930s economic crisis that drove the shift from dual to cooperative federalism was the _____.", "a": ["Great Depression", "Depression"]}, {"k": "fill", "q": "FDR's program that expanded federal authority over the economy in the 1930s was the _____.", "a": ["New Deal"]}, {"k": "tf", "q": "Under dual federalism, the national and state governments shared responsibility for nearly all functions.", "a": false, "why": "That describes cooperative federalism. Dual federalism kept the two levels in distinct spheres."}, {"k": "fill", "q": "The New Deal law that set a federal minimum wage was the Fair Labor _____ Act.", "a": ["Standards"]}]}]}, {"id": "III", "title": "Congress", "blurb": "Lectures 8–10. Who can serve, who runs each chamber, how a bill becomes law, and why the Senate was built the way it was.", "items": [{"id": "qualifications", "t": "Constitutional qualifications for service in Congress", "src": "Lecture 8", "core": ["House: **25** years old, citizen **7** years. Senate: **30** years old, citizen **9** years. Both: resident of the state."], "read": ["**House of Representatives:** at least **25** years old; a citizen for at least **7** years; a resident of the state that elects them.", "**Senate:** at least **30** years old; a citizen for at least **9** years; a resident of the state that elects them.", "These qualifications can only be changed by **amending the Constitution**."], "trap": ["The president's minimum age, 35, is a likely distractor. House 25, Senate 30, president 35."], "q": [{"k": "fill", "q": "A senator must be at least _____ years old.", "a": ["30", "thirty"]}, {"k": "fill", "q": "A member of the House must have been a citizen for at least _____ years.", "a": ["7", "seven"]}, {"k": "tf", "q": "Changing the minimum age for House members would take a constitutional amendment.", "a": true, "why": "The qualifications are in the Constitution, so only an amendment can change them."}, {"k": "sort", "q": "Whose requirement is it?", "buckets": ["House", "Senate", "President"], "items": [["At least 25 years old", 0], ["A citizen for at least 7 years", 0], ["At least 30 years old", 1], ["A citizen for at least 9 years", 1], ["At least 35 years old", 2]]}]}, {"id": "terms", "t": "House and Senate terms (and how the chambers differ)", "src": "Lecture 8", "core": ["House: **2**-year terms, **435** members, limited debate. Senate: **6**-year terms, **100** members, nearly unlimited debate.", "Most of the work happens in **committees**."], "read": ["**House term: 2 years. Senate term: 6 years.** The House has **435** members; the Senate has **100**.", "Tenure: in the 19th century, turnover ran at **40–50%** (Washington was far away and hard to reach). From 1950 to 2020, **94%** of House incumbents and **83%** of Senate incumbents who ran were reelected.", "**House:** more members, so more rigid, formal rules; **debate is limited**. **Senate:** fewer members, so loose, informal rules; **debate is nearly unlimited**; more deliberative and collegial.", "**Committees** are the principal vehicles through which the House and Senate do most of their legislative work. They developed because floor debate on every issue became inefficient as the workload and membership grew."], "q": [{"k": "sort", "q": "House or Senate?", "buckets": ["House", "Senate"], "items": [["Debate is limited", 0], ["Rigid, formal rules", 0], ["The larger chamber", 0], ["Debate is nearly unlimited", 1], ["Loose, informal rules", 1], ["More deliberative and collegial", 1]]}, {"k": "fill", "q": "Senators serve six-year terms. House members serve terms of _____ years.", "a": ["2", "two"]}, {"k": "tf", "q": "Debate is more tightly limited in the House than in the Senate.", "a": true, "why": "The House limits debate. The Senate's is nearly unlimited, which is what makes the filibuster possible."}, {"k": "fill", "q": "The principal vehicles through which the House and Senate do most of their legislative work are _____.", "a": ["committees", "congressional committees", "the committees"]}]}, {"id": "speaker", "t": "Speaker of the House's responsibilities", "src": "Lecture 8", "core": ["Presides over the House. Refers bills to committees, decides what reaches the floor, appoints committee members, **controls the Rules Committee**.", "Serves on **no** committee. Second in line to the presidency."], "read": ["The **Speaker** is the presiding officer of the House, elected at the opening of each Congress by a vote of all the members; in effect, chosen by the **majority party**. The Speaker is **second in line** to succeed the president, after the Vice President. Current Speaker: Mike Johnson.", "Responsibilities: decides **which bills go to which committees**; decides which bills **reach the floor for a vote, and when**; **appoints members to committees**; **controls the Rules Committee**, which sets the rules for debate on a bill (how long members can speak, whether amendments are allowed); **presides over debate** on the House floor (who gets to speak).", "The Speaker **does not serve on committees**.", "**House Majority Leader:** the Speaker's principal deputy (Steve Scalise). **Minority Leader:** represents the minority party and has little role in setting the agenda (Hakeem Jeffries)."], "trap": ["“The Speaker serves on committees” is false. The Speaker controls the Rules Committee without sitting on it."], "q": [{"k": "pick", "q": "Which of these are the Speaker's responsibilities? Pick all that apply.", "opts": [["Deciding which committee a bill goes to", true], ["Deciding which bills reach the floor, and when", true], ["Appointing members to committees", true], ["Presiding over floor debate", true], ["Casting tie-breaking votes in the Senate", false], ["Presiding over impeachment trials", false], ["Confirming presidential appointments", false]]}, {"k": "tf", "q": "The Speaker of the House sits on several standing committees.", "a": false, "why": "The Speaker appoints members to committees but does not serve on any."}, {"k": "fill", "q": "The Speaker controls the House _____ Committee, which decides how long a bill is debated and whether amendments are allowed.", "a": ["Rules"]}, {"k": "tf", "q": "The Speaker of the House is second in line to succeed the president, after the Vice President.", "a": true, "why": "Straight from the lecture slide."}]}, {"id": "senate-president", "t": "President of the Senate", "src": "Lecture 8", "core": ["The **Vice President**: presides and votes only to **break a tie**. The **president pro tempore** fills in."], "read": ["The **President of the Senate is the Vice President** of the United States. The Constitution says the VP presides over the Senate but **votes only in case of a tie**.", "The Senate appoints a **president pro tempore** to preside when the VP is absent. It's an honorary position for the most senior member of the majority party (currently Chuck Grassley).", "**Senate Majority Leader:** elected by the members of the majority party. Works with the minority leader to set the Senate's agenda, manage floor debate, and broker agreements and deals (John Thune; minority leader Chuck Schumer)."], "q": [{"k": "fill", "q": "The President of the Senate is the _____ of the United States.", "a": ["Vice President", "VP", "vice-president"]}, {"k": "fill", "q": "When the Vice President is absent, the Senate is presided over by the president _____.", "a": ["pro tempore", "pro tem"]}, {"k": "tf", "q": "The Vice President casts a vote on every bill that comes before the Senate.", "a": false, "why": "The VP votes only to break a tie."}, {"k": "sort", "q": "Which Senate officer is it?", "buckets": ["Vice President", "President pro tempore", "Majority leader"], "items": [["Presides over the Senate under the Constitution", 0], ["Votes only to break a tie", 0], ["Presides when the Vice President is away", 1], ["An honorary post for the most senior member of the majority party", 1], ["Sets the Senate's agenda and manages floor debate", 2], ["Elected by the members of the majority party", 2]]}]}, {"id": "models", "t": "Models of representation: Delegate, Trustee, Politico", "src": "Lecture 8", "core": ["**Delegate:** vote what constituents want. **Trustee:** use your own judgment. **Politico:** delegate when opinion is clear, trustee when it isn't."], "read": ["**Delegate:** the representative's principal role is to **reflect the views of his or her constituents**.", "**Trustee:** representatives should listen to their constituents but use **their own expertise and judgment** to decide public issues.", "**Politico:** representatives follow constituent opinion **where it is clear**, and their own judgment or political interest when constituent opinion is **amorphous or divided**."], "q": [{"k": "fill", "q": "A representative who listens to constituents but in the end votes on her own expertise and judgment is following the _____ model.", "a": ["trustee"]}, {"k": "fill", "q": "A representative whose main job is to reflect the views of his constituents is following the _____ model.", "a": ["delegate"]}, {"k": "fill", "q": "Following constituents when their opinion is clear, and your own judgment when it's divided, is the _____ model.", "a": ["politico"]}, {"k": "sort", "q": "Which model of representation is each legislator following?", "buckets": ["Delegate", "Trustee", "Politico"], "items": [["Always votes the way most of her district wants, even against bills she personally likes", 0], ["Sees the job as mirroring constituents' views", 0], ["Hears his district out, then votes his own reading of the evidence", 1], ["Relies on his own expertise to decide public issues", 1], ["Follows the district when its view is clear, and her own judgment when it is split", 2]]}]}, {"id": "leg-process", "t": "The legislative process", "src": "Lecture 9", "core": ["The order: introduction and referral → committee (**hearings → markup → report**) → floor → vote → conference committee → president.", "House: **Rules Committee**, **Committee of the Whole**. Senate: **filibuster**, ended only by **cloture (60 votes)**.", "Passing takes a simple majority. Both chambers must pass **identical** text. Overriding a veto takes **two-thirds** of both houses."], "read": ["About **90% of bills die without a floor vote**. In 2023, of 12,000+ bills introduced, just **27** became law. **Veto points:** committee consideration, floor consideration, the Speaker's refusal to schedule a bill, the filibuster, conference negotiations, a presidential veto.", "**1. Introduction and referral.** Only a member of the House or Senate can introduce a bill in their chamber; that member is the **sponsor**. The bill gets a number (HR 1, S 1). **Referral** is the process of assigning the bill to a committee for initial consideration.", "**2. Committee consideration**, three stages in this order: **public hearings** (witnesses with various viewpoints) → **markup** (the bill-rewriting stage: edits and amendments, then a vote to report the bill or **table** it) → **report** (staff write up the bill's intent, major provisions, and cost; it's often the only thing other members read).", "**3. Floor consideration, House.** The **Rules Committee** sets the rules for the bill (debate time, which amendments are allowed). For major bills the House dissolves into the **Committee of the Whole**, which allows less restrictive debate and lowers the quorum from **218 to 100**. After amendments it “rises” and reports the bill back to the full House for a vote on final passage.", "**3. Floor consideration, Senate.** More fluid. **Filibuster:** senators have the right of unlimited debate, which a senator can use to stall or block a bill. **Cloture:** a vote of **60** senators, the only way to halt a filibuster. It stops debate and moves to a vote on final passage.", "**4. Floor vote.** Bills pass each chamber by a **simple majority** of members present and voting, provided a **quorum** is present (218 in the House, 51 in the Senate).", "**5. Conference committee.** A bill can't go to the president until both chambers pass it in **identical form**. A conference committee resolves the differences (historically about 10% of bills). Alternatives: one chamber adopts the other's version, or party leaders negotiate informally.", "**6. President.** Signs or vetoes. Congress can override a veto with **two-thirds of both houses**."], "trap": ["“A bill needs 60 votes to pass the Senate” is false. Sixty is for **cloture** (ending debate). Passage takes a simple majority.", "Know the committee order cold: **hearings → markup → report**. No group in the recitation review got it."], "q": [{"k": "order", "q": "Put the steps of the legislative process in order.", "items": ["Introduction and referral", "Committee consideration", "Floor consideration", "Floor vote", "House and Senate versions are reconciled", "President signs or vetoes"]}, {"k": "order", "q": "Put the three stages of committee consideration in order.", "items": ["Public hearings", "The bill is rewritten and amended", "Report"]}, {"k": "fill", "q": "The committee stage in which members go through the bill, edit it, and offer amendments is called _____.", "a": ["markup", "mark-up", "mark up", "the markup"]}, {"k": "fill", "q": "The 60-vote procedure that ends a Senate filibuster is called _____.", "a": ["cloture"]}, {"k": "fill", "q": "To speed up debate on major bills, the House dissolves into the Committee of the _____.", "a": ["Whole", "Whole House"]}, {"k": "fill", "q": "When the House and Senate pass different versions of a bill, a(n) _____ committee works out one identical text.", "a": ["conference"]}, {"k": "tf", "q": "A bill needs 60 votes to pass the Senate.", "a": false, "why": "Sixty votes ends debate (cloture). Final passage takes a simple majority of those present and voting."}, {"k": "tf", "q": "In committee, markup comes before the public hearings.", "a": false, "why": "The order is hearings, then markup, then report."}, {"k": "fill", "q": "The Committee of the Whole lowers the House quorum from 218 to _____.", "a": ["100", "one hundred"]}, {"k": "tf", "q": "A bill can go to the president as soon as each chamber has passed its own version of it.", "a": false, "why": "Both chambers must pass it in identical form first."}]}, {"id": "redistricting", "t": "Redistricting + Gerrymandering", "src": "Lecture 10 + recitation", "core": ["**Redistricting:** redrawing district lines after each census. **Gerrymandering:** drawing them for party advantage, named for Governor Elbridge **Gerry**."], "read": ["**Redistricting:** the redrawing of congressional district boundaries **after each census** to account for population shifts. It makes sure each congressperson represents the same number of constituents in their state.", "**Gerrymander:** the strange shape of some congressional districts that results when parties draw districts to **maximize their political advantage**. The term was first applied to a district signed into law by Massachusetts Governor **Elbridge Gerry** after the **1810** census.", "From recitation: **reapportionment** is dividing the 435 House seats *among the states* after the census. **Redistricting** is redrawing the lines *inside* a state afterward. Gerrymandering happens at the redistricting stage.", "From recitation: **packing** concentrates the other party's voters into a few districts, so their extra votes are wasted. **Cracking** splits them across many districts, so they fall short of a majority everywhere."], "trap": ["Reapportionment versus redistricting is a swapped-term trap: seats among states versus lines within a state."], "q": [{"k": "fill", "q": "Within each state, the lines of House members' constituencies are redrawn to account for population shifts. This is called _____.", "a": ["redistricting"], "x": ["reapportionment"]}, {"k": "fill", "q": "The practice of drawing oddly shaped districts for party advantage is named after an early-1800s Massachusetts governor, Elbridge _____.", "a": ["Gerry"]}, {"k": "fill", "q": "Concentrating the other party's voters into a few districts, so their extra votes are wasted, is called _____.", "a": ["packing"]}, {"k": "fill", "q": "Splitting the other party's voters across many districts, so they fall short everywhere, is called _____.", "a": ["cracking"]}, {"k": "tf", "q": "Congressional districts are redrawn every two years, before each House election.", "a": false, "why": "Redistricting follows the census, which happens every ten years."}, {"k": "sort", "q": "Which term fits?", "buckets": ["Reapportionment", "Redistricting", "Gerrymandering"], "items": [["Dividing the 435 House seats among the states", 0], ["Happens first, before any lines are drawn", 0], ["Redrawing the district lines inside a state", 1], ["Drawing district lines to maximize a party's advantage", 2], ["Produces strangely shaped districts", 2]]}]}, {"id": "fed63", "t": "Federalist 63: how would an indirectly elected Senate protect against tyranny?", "src": "Lecture 10", "core": ["The **Senate**, with longer terms and (originally) no direct election, is a check on the people's **temporary passions**: their “temporary errors and delusions.”", "Two more benefits: the respect of **foreign powers**, and “**sufficient permanency**” to answer for long-term policy."], "read": ["Background: senators were originally chosen by **state legislatures**, not by voters, and they serve six-year terms.", "The **House** is directly elected every two years, so it gives in to the will of the majority or loses reelection. That makes tyranny more likely.", "The **Senate** is protection against the **passions of the majority**. With no direct election and longer terms, it is insulated from immediate passions. It is “a defense to the people against their own **temporary errors and delusions**,” for moments when the people, “stimulated by some irregular passion,” call for measures “which they themselves will afterwards be the most ready to lament and condemn.”", "**Esteem of foreign powers:** longer terms and indirect election make a “select and stable” body, which earns the respect of other nations.", "**Responsibility:** longer terms make members *more* accountable. A body with “**sufficient permanency**” can be answerable for objects that need “continued attention,” meaning policies whose results take years.", "**Objection:** a Senate not chosen directly by the people, with six-year terms, will turn into a “**tyrannical aristocracy**.” **Reply:** to do that it would first have to corrupt **itself**, then the **state legislatures**, then the **House of Representatives**, and finally the **people at large**."], "trap": ["No group in the recitation review got the Fed 63 clue. The answer they wanted: the Senate is a **check on temporary public passions**. A second clue wanted **sufficient permanency**."], "q": [{"k": "open", "q": "How would an indirectly elected Senate protect against tyranny, according to Federalist 63?", "a": "The House is directly elected every two years, so it follows the majority's passions.\nThe Senate, indirectly elected with longer terms, is insulated from them. It defends the people against their own “temporary errors and delusions.”"}, {"k": "pick", "q": "Beyond checking the people's passions, which benefits does Federalist 63 claim for the Senate? Pick all that apply.", "opts": [["Other nations will respect a select and stable body", true], ["It stays in office long enough to be held responsible for long-term results", true], ["It mirrors the people more closely than the House does", false], ["Frequent elections keep it accountable", false], ["It originates revenue bills", false]]}, {"k": "order", "q": "Federalist 63's reply to the “tyrannical aristocracy” objection: before it could take over, the Senate would have to corrupt, in this order…", "items": ["Itself", "The state legislatures", "The House of Representatives", "The people at large"]}, {"k": "fill", "q": "Federalist 63: without a “select and stable” body in the government, the esteem of _____ powers will be forfeited.", "a": ["foreign"]}, {"k": "fill", "q": "Federalist 63 calls the Senate a defense to the people “against their own temporary errors and _____.”", "a": ["delusions"]}, {"k": "tf", "q": "Federalist 63 argues that longer terms make senators more accountable, not less.", "a": true, "why": "The “responsibility” argument: enough permanency lets the Senate answer for long-term results."}, {"k": "fill", "q": "Federalist 63 says the Senate needs “sufficient _____” to be answerable for policies that take years to play out.", "a": ["permanency", "permanence"]}]}, {"id": "amend17", "t": "17th Amendment", "src": "Lecture 10", "core": ["**1913:** **direct election** of senators by the voters, replacing selection by state legislatures."], "read": ["**Seventeenth Amendment (1913):** provided for the **direct election** of U.S. senators by the voters of each state, replacing selection by the **state legislatures**.", "Pair it with Federalist 63: the amendment removed the indirect election that Madison was defending."], "q": [{"k": "fill", "q": "Direct election of U.S. senators by the voters came with the _____ Amendment.", "a": ["Seventeenth", "17th", "17"]}, {"k": "fill", "q": "Under the original Constitution, U.S. senators were chosen by the state _____, not by the voters.", "a": ["legislatures", "legislature"]}, {"k": "tf", "q": "The Seventeenth Amendment was ratified in 1913.", "a": true, "why": "1913, replacing selection by state legislatures."}]}]}, {"id": "IV", "title": "The Presidency", "blurb": "Lectures 11–13. What the Constitution gives the president, the fight over war powers, and the two ways to remove one.", "items": [{"id": "pres-powers", "t": "Powers of the President per the Constitution", "src": "Lecture 11", "core": ["**Pardon** (the only exclusive power; federal crimes only) · **veto** (override takes two-thirds) · **Take Care Clause** · **appointments** (Senate, simple majority) · **treaties** (two-thirds of the Senate) · **commander-in-chief**.", "An **executive agreement** works like a treaty with no Senate vote. To be president: 35, a resident for 14 years, natural-born."], "read": ["**Requirements:** **35** years old; **14** years a resident; a **natural-born** citizen.", "Most executive powers are **shared**: appointments and treaties with the Senate, war-making with the whole Congress. The president's one **exclusive** power is the **pardon**.", "**1. Pardon power** (Article II, Section 2): “reprieves and pardons for offenses against the United States, except in cases of impeachment.” It covers **federal** offenses only: not state crimes, not impeachment.", "**2. Veto power** (Article I, Section 7): every bill passed by Congress is presented to the president. If it's vetoed, Congress can repass it by **two-thirds of each house** or revise it. Overrides are hard, so the veto matters as much as a threat as in actual use.", "**3. Take Care Clause** (Article II, Section 3): the president “shall take Care that the Laws be faithfully executed.” The president must enforce the laws Congress passes, with some discretion over how. **Executive orders** are a major tool for this.", "**4. Appointment power** (Article II, Section 2): shared with the Senate. Cabinet members, federal judges, ambassadors, heads of independent agencies, top military officers. Senate confirmation takes a **simple majority**.", "**5. Foreign affairs and treaties** (Article II, Section 2): “receive Ambassadors” grew into the right to **recognize** other nations. Treaties need **two-thirds of the senators present**. **Executive agreements** have the same legal status as treaties but need **no Senate vote**; they last until a later president repeals them (Obama's 2015 Iran nuclear deal).", "**6. Commander-in-chief** (Article II, Section 2): Congress has the power to “raise and support” armies and to “declare war.” The president is in charge once the armed forces are committed."], "trap": ["Two thresholds people swap: a **treaty** needs two-thirds of the Senate; **confirming an appointee** needs a simple majority. An executive agreement needs no Senate vote."], "q": [{"k": "pick", "q": "Which of these are powers of the president under the Constitution? Pick all that apply.", "opts": [["Vetoing bills", true], ["Making treaties, with the Senate's consent", true], ["Appointing senior officials, with Senate confirmation", true], ["Commanding the armed forces", true], ["Granting reprieves for federal offenses", true], ["Declaring war", false], ["Raising and supporting armies", false], ["Ratifying constitutional amendments", false]]}, {"k": "fill", "q": "The one power the president holds exclusively, shared with neither chamber, is the _____ power.", "a": ["pardon", "pardoning"]}, {"k": "tf", "q": "The president's pardon power does not reach state crimes.", "a": true, "why": "It covers offenses against the United States only: no state crimes, and no cases of impeachment."}, {"k": "fill", "q": "The president's duty to see that the laws are “faithfully executed” comes from the _____ Clause.", "a": ["Take Care"]}, {"k": "fill", "q": "An international deal that has the legal status of a treaty but needs no Senate vote is a(n) _____ agreement.", "a": ["executive"]}, {"k": "tf", "q": "Confirming a Cabinet nominee requires a two-thirds vote of the Senate.", "a": false, "why": "Confirmation takes a simple majority."}, {"k": "fill", "q": "A treaty takes effect only if _____ of the senators present agree.", "a": ["two-thirds", "2/3", "two thirds", "⅔", "2/3rds"]}, {"k": "pick", "q": "Which of these are constitutional requirements to be president? Pick all that apply.", "opts": [["At least 35 years old", true], ["A resident for 14 years", true], ["A natural-born citizen", true], ["At least 30 years old", false], ["A citizen for at least 9 years", false], ["A resident of the state that elects them", false]]}]}, {"id": "declare-war", "t": "Declare War Clause", "src": "Lectures 11–12", "core": ["**Article I, Section 8:** **Congress** declares war. The president commands as commander-in-chief."], "read": ["**Article I, Section 8, Clause 11:** “[The Congress shall have Power...] To **declare War**, grant Letters of Marque and Reprisal, and make Rules concerning Captures on Land and Water.”", "The division of labor: **Congress declares** war and raises and supports the military. The **president commands** once forces are committed.", "Taught alongside it, the **Executive Vesting Clause** (Article II, Section 1): “The executive power shall be vested in a President.” Compare Article I: “All legislative Powers **herein granted** shall be vested in a Congress.” The missing “herein granted” is the textual hook for a broad view of presidential power."], "q": [{"k": "tf", "q": "The Constitution gives the power to declare war to the president as commander-in-chief.", "a": false, "why": "The Declare War Clause gives it to Congress. The president commands once forces are committed."}, {"k": "fill", "q": "The Declare War Clause is found in Article I, Section _____.", "a": ["8", "eight"]}, {"k": "sort", "q": "War powers: Congress or the president?", "buckets": ["Congress", "President"], "items": [["Declares war", 0], ["Raises and supports armies", 0], ["Controls the funding for a war", 0], ["Commander-in-chief of the armed forces", 1], ["Directs military operations once forces are committed", 1]]}, {"k": "fill", "q": "Article II, Section 1, which places “the executive power” in a President, is called the Executive _____ Clause.", "a": ["Vesting"]}]}, {"id": "unitary", "t": "Unitary Executive Theory and the George W. Bush administration", "src": "Lecture 12", "core": ["The president has total control of the executive branch and can use force **without prior congressional approval**.", "**John Yoo** (Bush Justice Department) after 9/11: Congress's only check is the **power of the purse**."], "read": ["**Unitary executive theory:** a strong-presidency theory holding that the president has **total control over the executive branch** and can **use military force without prior congressional approval**.", "After 9/11, Congress passed the **Authorization for Use of Military Force (AUMF) of 2001**, a joint resolution authorizing Bush to “use all necessary and appropriate force” against those behind the attacks.", "**John Yoo**, a Bush administration lawyer in the Justice Department, argued that congressional authorization was **unnecessary**: “The power to initiate military hostilities, particularly in response to the threat of an armed attack, rests exclusively with the president.”", "Yoo read the **Declare War Clause narrowly**: it gives Congress only a “**juridical**” power, one that defines the legal state of relations between the US and another country (for example, triggering the Geneva Conventions). It doesn't decide whether the country fights.", "On this view, Congress's only check on a president at war is the **power of the purse**."], "q": [{"k": "open", "q": "State the unitary executive theory.", "a": "The president has total control over the executive branch and can use military force without prior congressional approval."}, {"k": "open", "q": "What did the Bush Justice Department's lawyer argue about Congress's authorization and about the Declare War Clause?", "a": "Authorization was unnecessary: the power to initiate hostilities rests exclusively with the president.\nThe Declare War Clause gives Congress only a juridical power (defining the legal state of relations).\nCongress's only wartime check is the power of the purse."}, {"k": "fill", "q": "The Bush Justice Department lawyer who argued that the president alone can initiate military hostilities was John _____.", "a": ["Yoo"]}, {"k": "fill", "q": "On the unitary executive view, Congress's only check on a president at war is the power of the _____.", "a": ["purse"]}, {"k": "tf", "q": "The unitary executive theory holds that the president must get Congress's approval before using military force.", "a": false, "why": "The theory says no prior congressional approval is needed."}, {"k": "fill", "q": "Three days after 9/11, Congress passed a joint resolution letting Bush use “all necessary and appropriate force.” It is known by the abbreviation _____.", "a": ["AUMF", "Authorization for Use of Military Force"]}]}, {"id": "wpr", "t": "War Powers Resolution of 1973", "src": "Lecture 12", "core": ["**Consult** Congress first; **report within 48 hours**; **withdraw within 60 days** unless Congress approves."], "read": ["Three requirements.", "**1. Consultation:** the president must consult with Congress “in every possible instance” *before* introducing U.S. armed forces into hostilities.", "**2. Reporting:** if troops are deployed without a declaration of war, the president must report to Congress within **48 hours** (circumstances, scope, duration).", "**3. The 60-day clock:** once forces are deployed, the president must end their use within **60 days** unless Congress declares war, authorizes the use of force, or extends the period by law."], "q": [{"k": "pick", "q": "Which of these does the War Powers Resolution require of the president? Pick all that apply.", "opts": [["Consult Congress before sending forces into hostilities, whenever possible", true], ["Report to Congress soon after deploying troops without a declaration of war", true], ["Pull the forces out after a set period unless Congress approves", true], ["Obtain a declaration of war before any deployment", false], ["Win a two-thirds vote of the Senate for any deployment", false], ["Ask the courts to review the deployment", false]]}, {"k": "fill", "q": "Under the War Powers Resolution, the president must report a deployment to Congress within _____ hours.", "a": ["48", "forty-eight", "forty eight"]}, {"k": "fill", "q": "Without congressional approval, the president must end a deployment within _____ days.", "a": ["60", "sixty"]}, {"k": "tf", "q": "The War Powers Resolution tells the president to consult Congress “in every possible instance” before sending forces into hostilities.", "a": true, "why": "That is the consultation requirement, the first of the three."}, {"k": "fill", "q": "The War Powers Resolution was passed in the year _____.", "a": ["1973"]}]}, {"id": "prerogative", "t": "John Locke on “prerogative”", "src": "Lecture 12", "core": ["**Prerogative:** the executive's discretion to act for the public good **without the law, and sometimes against it**. Example: pulling down a house to stop a fire."], "read": ["**Prerogative:** the power “to act according to **discretion for the public good**, **without the prescription of the law and sometimes even against it**.” (*Second Treatise of Government*.)", "Why the executive needs it: the lawmaking power is **not always in being** (not always in session); it is **too numerous and so too slow**; and laws **cannot foresee** every accident and necessity.", "His example: a rigid observation of the law can do harm, like refusing to pull down an innocent man's **house to stop a fire** when the house next to it is burning."], "q": [{"k": "fill", "q": "Locke's term for executive discretion to act for the public good without the law, and sometimes against it, is _____.", "a": ["prerogative"]}, {"k": "open", "q": "Define prerogative. Give Locke's reasons for it and his example.", "a": "Acting by discretion for the public good, without the law's prescription and sometimes against it.\nReasons: the legislature isn't always in session, is too numerous and slow, and can't foresee everything.\nExample: pulling down an innocent man's house to stop a fire."}, {"k": "tf", "q": "For Locke, prerogative includes acting against the law, not just where the law is silent.", "a": true, "why": "His definition: “without the prescription of the law and sometimes even against it.”"}]}, {"id": "lincoln", "t": "Lincoln on presidential authority", "src": "Lecture 12", "core": ["Letter to **Hodges** (1864): otherwise unconstitutional measures become lawful when they are **indispensable** to preserving the nation and the Constitution."], "read": ["**Letter to Hodges, April 4, 1864.** Otherwise unconstitutional measures become lawful if they are absolutely necessary to preserve the Constitution.", "“I felt that measures, **otherwise unconstitutional**, might become lawful, by becoming **indispensable** to the preservation of the constitution, through the preservation of the nation.”", "He could not feel he had tried to preserve the Constitution if, “to save slavery, or any minor matter,” he permitted “the wreck of government, country, and Constitution all together.”"], "q": [{"k": "open", "q": "State Lincoln's view of presidential authority, as he set it out in his 1864 letter.", "a": "Measures that would otherwise be unconstitutional can become lawful when they are indispensable to preserving the Constitution, by preserving the nation."}, {"k": "fill", "q": "Lincoln set out his view of emergency presidential power in his April 1864 letter to _____.", "a": ["Hodges", "Albert Hodges", "Albert G. Hodges"]}, {"k": "tf", "q": "Lincoln argued that a president may never take an otherwise unconstitutional measure, even to save the nation.", "a": false, "why": "He argued such measures “might become lawful” when indispensable to preserving the nation and the Constitution."}, {"k": "fill", "q": "Lincoln: measures otherwise unconstitutional “might become lawful, by becoming _____ to the preservation of the constitution.”", "a": ["indispensable", "necessary", "absolutely necessary", "essential"]}]}, {"id": "impeachment", "t": "Impeachment process", "src": "Lecture 12", "core": ["The **House** impeaches by a **simple majority**. The **Senate** holds the trial; **two-thirds** to convict.", "Grounds: “treason, bribery, or other **high crimes and misdemeanors**.” Penalty: removal. No president has ever been convicted."], "read": ["**Impeachment:** the process by which Congress can remove officers of the federal government.", "**House of Representatives:** the “sole power of impeachment,” meaning the power to formally *charge* an officer. It approves articles of impeachment by a **simple majority** (Article I, Section 2).", "**Senate:** the “sole power to try all impeachments.” Conviction takes **two-thirds of the senators present** (Article I, Section 3).", "**Impeachable offenses** (Article II, Section 4): “**treason, bribery, or other high crimes and misdemeanors**.”", "**Punishment:** only **removal from office** and a bar on further national government service. Offenders can still face action in state and federal courts.", "The record: **22** impeachments in U.S. history. Three presidents: **Andrew Johnson (1868), Bill Clinton (1998), Donald Trump (2019 and 2021)**. Only **eight** officials were convicted by the Senate, **all federal judges**."], "trap": ["**Impeached does not mean removed.** Impeachment is the House's charge. No president has been convicted by the Senate."], "q": [{"k": "sort", "q": "Impeachment: which chamber does it?", "buckets": ["House", "Senate"], "items": [["Brings the charges", 0], ["Approves the articles of impeachment", 0], ["Holds the trial", 1], ["Votes on whether to convict and remove", 1]]}, {"k": "fill", "q": "The House approves articles of impeachment by a(n) _____ majority.", "a": ["simple"]}, {"k": "fill", "q": "Convicting an impeached official takes _____ of the senators present.", "a": ["two-thirds", "2/3", "two thirds", "⅔", "2/3rds"]}, {"k": "tf", "q": "Three presidents have been removed from office through impeachment.", "a": false, "why": "Three presidents have been impeached (Johnson, Clinton, Trump). None was convicted and removed."}, {"k": "fill", "q": "All eight officials ever convicted by the Senate in impeachment trials were federal _____.", "a": ["judges"]}, {"k": "tf", "q": "The House holds the “sole power of impeachment”; the Senate holds the “sole power to try all impeachments.”", "a": true, "why": "The House charges. The Senate holds the trial."}]}, {"id": "trump-impeach", "t": "Trump's impeachments (2019 and 2021). Why was he impeached?", "src": "Lectures 12–13", "core": ["**2019:** **abuse of power** (pressuring Ukraine) and **obstruction of Congress**. Acquitted.", "**2021:** **incitement of insurrection** (January 6). Acquitted 57–43."], "read": ["**First impeachment, December 2019. Two charges.**", "**Charge 1, abuse of power:** he solicited the interference of a foreign government, **Ukraine**, in the 2020 presidential election. He pressed Ukraine to publicly announce investigations that would help his reelection and hurt a political opponent, and conditioned official U.S. acts on it.", "**Charge 2, obstruction of Congress:** he directed executive branch agencies and officials not to comply with the House's **subpoenas** in the impeachment inquiry.", "**Acquitted by the Senate, February 2020:** 52–48 on abuse of power, 53–47 on obstruction.", "**Second impeachment, January 13, 2021. One charge: incitement of insurrection.** He repeated false claims that the election was stolen, then addressed a crowd at the Ellipse (“if you don't fight like hell you're not going to have a country anymore”). Members of the crowd breached the Capitol to interfere with the certification of the 2020 results.", "He left office before the Senate trial. Most Republicans argued impeachment can't be used against a former official. **Acquitted February 13, 2021, 57–43**: ten votes short of the 67 needed. **Seven Republicans** voted guilty, the most of a president's own party in U.S. history."], "q": [{"k": "sort", "q": "Which impeachment?", "buckets": ["2019 impeachment", "2021 impeachment"], "items": [["Soliciting a foreign government's help in an election", 0], ["Refusing to comply with House subpoenas", 0], ["Two articles of impeachment", 0], ["The attack on the Capitol during the electoral-vote count", 1], ["One article of impeachment", 1], ["Tried after he had left office", 1], ["Seven senators of his own party voted to convict", 1]]}, {"k": "open", "q": "In a sentence each: why was Trump impeached in 2019, and why in 2021?", "a": "2019: abuse of power (soliciting Ukraine's interference in the 2020 election) and obstruction of Congress (defying House subpoenas).\n2021: incitement of insurrection (the January 6 attack on the Capitol).\nAcquitted both times; 57–43 in 2021."}, {"k": "fill", "q": "The single charge in Trump's 2021 impeachment was incitement of _____.", "a": ["insurrection"]}, {"k": "fill", "q": "The foreign country at the center of Trump's 2019 impeachment was _____.", "a": ["Ukraine"]}, {"k": "fill", "q": "The two charges in 2019 were abuse of power and _____ of Congress.", "a": ["obstruction"]}, {"k": "tf", "q": "In Trump's 2021 Senate trial, seven Republicans voted to convict, but the vote fell short of two-thirds.", "a": true, "why": "57–43, ten short of the 67 needed. He was acquitted."}]}, {"id": "amend25", "t": "25th Amendment", "src": "Lecture 13", "core": ["The **Vice President and a majority of the Cabinet** declare the president unable to serve, and the VP becomes Acting President. If the president contests it, it takes **two-thirds of both houses** within 21 days."], "read": ["**25th Amendment (1967):** a second way to remove an unfit president from office.", "The **Vice President and a majority of the Cabinet** (8 of 15 members) declare the president “unable to discharge the powers and duties of his office.” The **VP becomes Acting President**.", "If the president formally resists by declaring himself fit, **Congress** must resolve the issue within **21 days**. If **two-thirds of both houses** agree with the Cabinet, he is removed. If not, he is restored to office.", "From the reading and the TA's review: the **22nd Amendment** limits a president to two terms."], "trap": ["Under the 25th, the **VP and the Cabinet** start the process, not Congress. That's what separates it from impeachment."], "q": [{"k": "fill", "q": "Under the 25th Amendment, the Vice President and a majority of the _____ can declare the president unable to serve.", "a": ["Cabinet", "president's Cabinet"]}, {"k": "order", "q": "Put the 25th Amendment process in order.", "items": ["The Vice President and a majority of the Cabinet declare the president unable to serve", "The Vice President becomes Acting President", "The president contests it, declaring himself fit", "Congress takes up the question", "Two-thirds of both houses must agree, or the president is restored"]}, {"k": "tf", "q": "The 25th Amendment's removal process begins with a majority vote of the House.", "a": false, "why": "It begins with the Vice President and a majority of the Cabinet. Congress only steps in if the president contests it."}, {"k": "fill", "q": "If the president contests the declaration, Congress must resolve the issue within _____ days.", "a": ["21", "twenty-one", "twenty one"]}, {"k": "fill", "q": "The amendment that limits a president to two terms is the _____ Amendment.", "a": ["22nd", "Twenty-Second", "twenty second", "22"]}]}]}, {"id": "V", "title": "The Judiciary", "blurb": "Lectures 13–14. What judicial review is, how the federal courts are built, and the Jefferson–Hamilton argument over who gets the last word.", "items": [{"id": "judicial-review", "t": "Judicial Review", "src": "Lecture 13", "core": ["The power of the federal courts to hold a law or official act “**null, void, and unenforceable**” because it conflicts with the Constitution. The courts strike it down."], "read": ["**Judicial review:** “the power of the federal courts to hold a law or official act based on law to be **null, void, and unenforceable** because it is in conflict with the Constitution.”", "The professor's warning: “declaring a law unconstitutional” is not the full definition. Anyone can say a law is unconstitutional. Judicial review means the courts **strike it down**.", "From the reading, not lecture: ***Marbury v. Madison* (1803)** established judicial review. Don't confuse it with *McCulloch v. Maryland* (1819), the implied-powers case."], "q": [{"k": "open", "q": "Define judicial review in the slide's words.", "a": "The power of the federal courts to hold a law or official act based on law to be null, void, and unenforceable because it conflicts with the Constitution."}, {"k": "fill", "q": "Judicial review lets the federal courts hold a law “null, _____, and unenforceable.”", "a": ["void"]}, {"k": "tf", "q": "Judicial review is the courts' power to warn Congress that a bill may be unconstitutional before it is passed.", "a": false, "why": "It's the power to strike down a law or official act already in force, holding it null, void, and unenforceable."}]}, {"id": "supremacy", "t": "Constitutional Supremacy vs Legislative Supremacy", "src": "Lecture 13", "core": ["**Constitutional supremacy** (US): courts can strike down laws. **Legislative supremacy** (UK): the legislature has the last word."], "read": ["In most countries, courts simply **apply** current law. They don't challenge the validity of democratic laws. That is **legislative supremacy**: the legislature has the final word, and judges can't strike its laws down. Examples: the **UK** and the **Netherlands**.", "**Constitutional supremacy:** the Constitution has the final word, and courts enforce it by striking down laws that conflict with it. Example: the **United States**.", "This is why law and the courts play a larger role in the United States than in any other country."], "q": [{"k": "fill", "q": "A system in which judges only apply the law and can never strike a statute down, as in the UK, has _____ supremacy.", "a": ["legislative", "parliamentary"]}, {"k": "sort", "q": "Constitutional or legislative supremacy?", "buckets": ["Constitutional supremacy", "Legislative supremacy"], "items": [["The United States", 0], ["Courts can strike down laws", 0], ["The United Kingdom", 1], ["The Netherlands", 1], ["Courts only apply the law", 1], ["The legislature has the final word", 1]]}, {"k": "tf", "q": "The United States is an example of constitutional supremacy.", "a": true, "why": "The Constitution has the final word and courts enforce it. The UK and the Netherlands are the examples of legislative supremacy."}]}, {"id": "jurisdiction", "t": "Jurisdiction of the federal courts", "src": "Lecture 13", "core": ["Two routes into federal court: a **federal question** (the Constitution or federal law), or **diversity of citizenship** (different states and more than **$75,000**)."], "read": ["Federal courts have jurisdiction over two kinds of cases.", "**1. Federal question:** cases that raise a question involving the **U.S. Constitution or federal law**. Civil (First or Fourth Amendment violations, employment discrimination) or criminal (racketeering, drug trafficking, bank robbery).", "**2. Diversity of citizenship:** disputes between two parties **not from the same state**, where the claim also meets a dollar threshold for damages: **$75,000**."], "q": [{"k": "fill", "q": "A case that involves the U.S. Constitution or federal law is said to raise a federal _____.", "a": ["question"]}, {"k": "fill", "q": "A suit between parties from different states that meets the dollar threshold reaches federal court through _____ of citizenship.", "a": ["diversity"]}, {"k": "pick", "q": "Which of these cases can be heard in federal court? Pick all that apply.", "opts": [["A lawsuit claiming a First Amendment violation", true], ["A federal drug-trafficking prosecution", true], ["A North Carolinian suing a Californian for $200,000 under state law", true], ["A North Carolinian suing a Californian for $10,000 under state law", false], ["Two North Carolinians disputing a contract under state law", false], ["A burglary charged under state law", false]]}, {"k": "tf", "q": "Any dispute between citizens of two different states can be heard in federal court, whatever the amount at stake.", "a": false, "why": "Diversity jurisdiction also requires the claim to meet the $75,000 threshold."}]}, {"id": "structure", "t": "The structure of the federal judicial system", "src": "Lecture 13", "core": ["**94** district courts → **13** courts of appeals → **1** Supreme Court."], "read": ["Three layers. **U.S. district courts** at the base: **94**. **U.S. courts of appeals** in the middle: **13**. The **U.S. Supreme Court** at the top: **1**."], "q": [{"k": "fill", "q": "The federal system has _____ U.S. district courts.", "a": ["94", "ninety-four", "ninety four"]}, {"k": "fill", "q": "The federal system has _____ U.S. courts of appeals.", "a": ["13", "thirteen"]}, {"k": "order", "q": "Order the federal courts from the base to the top.", "items": ["U.S. district courts", "U.S. courts of appeals", "U.S. Supreme Court"]}]}, {"id": "court-differences", "t": "Differences between U.S. District Court, U.S. Court of Appeals, Supreme Court", "src": "Lecture 13", "core": ["**District:** trials, with a jury. **Appeals:** three judges, no jury, legal questions only. **Supreme Court:** last resort; picks its cases (about 80 of 7,000–8,000 petitions)."], "read": ["**District courts:** the general **trial courts**. Virtually all federal cases are tried here. A district judge oversees the trial and a **jury** determines the verdict after reviewing documents, testimony, and physical evidence. Each state has between **one and four** district courts.", "**Courts of appeals:** the intermediate level; they hear appeals of cases tried in the district courts. **Three judges, no jury.** They usually don't consider new witnesses or new evidence. Appeals deal with **legal and procedural issues** (was a statute misapplied? was evidence wrongly admitted?), not the facts.", "Twelve courts of appeals cover regions of the country. The thirteenth is the **Court of Appeals for the Federal Circuit**: patents, trademarks, government contracts, international trade.", "**Supreme Court:** the **court of last resort**. It has broad discretion to hear only cases that raise important constitutional issues. It receives about **7,000–8,000** petitions each term and hears oral argument in about **80**."], "q": [{"k": "sort", "q": "Which court?", "buckets": ["District court", "Court of appeals", "Supreme Court"], "items": [["Holds trials", 0], ["A jury decides the verdict", 0], ["Hears witnesses and physical evidence", 0], ["The middle tier: a panel of judges, no jury", 1], ["Reviews district-court trials for legal and procedural errors, not the facts", 1], ["The court of last resort", 2], ["Chooses which cases it will hear", 2]]}, {"k": "tf", "q": "A U.S. court of appeals decides without a jury and usually hears no new evidence.", "a": true, "why": "Three judges, no jury. They review legal and procedural questions."}, {"k": "fill", "q": "The one court of appeals with nationwide jurisdiction over patents and trademarks is the Court of Appeals for the _____ Circuit.", "a": ["Federal"]}, {"k": "fill", "q": "A case in a U.S. court of appeals is heard by a panel of _____ judges.", "a": ["3", "three"]}, {"k": "tf", "q": "Virtually all federal cases begin in a U.S. district court.", "a": true, "why": "District courts are the general trial courts of the federal system."}]}, {"id": "cert", "t": "Writ of Certiorari (rule of four, circuit split)", "src": "Lecture 14", "core": ["**Writ of certiorari:** the order to send up a lower court's record. **Rule of four:** four justices grant it. Most likely when there's a **circuit split**."], "read": ["Most cases reach the Supreme Court by **cert petition** (petition for certiorari): 7,000–8,000 a year.", "A **writ of certiorari** is a judicial instrument that orders a lower court to **deliver its record** in a case so the higher court can review it.", "**Rule of four:** **four** justices must agree before a writ of certiorari is granted and the case is heard.", "**Circuit split:** the Court chooses cases mainly when the courts of appeals **interpret the law differently**. A circuit's ruling binds every district court in that circuit, so a split means federal law is applied non-uniformly across the country."], "trap": ["A likely true/false: four of nine is **not** a majority. Four justices grant cert; deciding the case still takes a majority."], "q": [{"k": "fill", "q": "The order by which the Supreme Court tells a lower court to send up its record for review is a writ of _____.", "a": ["certiorari", "cert"]}, {"k": "fill", "q": "The Supreme Court agrees to hear a case when _____ justices vote to grant the petition.", "a": ["4", "four"]}, {"k": "tf", "q": "A majority of the justices must agree before the Supreme Court will take a case.", "a": false, "why": "The rule of four: four of the nine justices is enough to grant cert."}, {"k": "fill", "q": "When courts of appeals reach different conclusions on the same legal issue, the result is called a circuit _____.", "a": ["split"]}, {"k": "pick", "q": "Which statements about getting a case to the Supreme Court are true? Pick all that apply.", "opts": [["A writ of certiorari orders a lower court to send up its record", true], ["Four justices are enough to grant the writ", true], ["The Court is likeliest to take a case when the courts of appeals disagree", true], ["A majority of the justices must agree to grant the writ", false], ["The Court must hear every appeal from a court of appeals", false], ["Most petitions are granted", false]]}]}, {"id": "tenure", "t": "Tenure of federal judges (and how they get the job)", "src": "Lecture 14", "core": ["Nominated by the president, confirmed by a **simple majority** of the Senate. They serve “**during good behavior**,” meaning for life, and can be removed only by impeachment."], "read": ["Federal judges are **nominated by the president** and confirmed by a **simple majority** of the senators present and voting. There are about **890** active federal judicial positions; 45–50 judges are confirmed each year.", "**Confirmation:** the nominee appears at a hearing before the **Senate Judiciary Committee**. The committee votes to report the nomination with a positive, negative, or split recommendation, or declines to report. Then the full Senate debates and votes.", "**Tenure:** federal judges hold their jobs “**during good behavior**,” which really means **for life**. They can be removed only by **impeachment** in the House and trial in the Senate.", "**Rationale:** they don't run for reelection, so they are insulated from social and political pressure when deciding cases."], "q": [{"k": "fill", "q": "Federal judges hold their offices “during good _____,” which in practice means for life.", "a": ["behavior", "behaviour"]}, {"k": "fill", "q": "A nominee for the federal bench appears at a confirmation hearing before the Senate _____ Committee.", "a": ["Judiciary"]}, {"k": "tf", "q": "Federal judges are confirmed by a simple majority of the senators present and voting.", "a": true, "why": "A simple majority, not two-thirds."}, {"k": "order", "q": "Put the path to a federal judgeship in order.", "items": ["The president nominates", "The Senate Judiciary Committee holds a hearing", "The committee votes on its recommendation", "The full Senate votes to confirm", "The judge serves during good behavior"]}]}, {"id": "scope", "t": "Scope of judicial review: agency actions, state legislation, congressional legislation, executive orders", "src": "Lecture 14", "core": ["Most to least common: **agency rules** → **state laws** → **acts of Congress** → **executive orders**."], "read": ["Four targets of judicial review, from **most to least common**.", "**1. Executive departments and agencies.** Much more common than review of federal or state legislation. Congress often legislates in general terms and leaves it to the agencies to write the detailed rules and regulations, and those rules get challenged.", "**2. State legislation.** More common than review of Congress or the president. About **1,335** state laws and state constitutional provisions have been struck down since 1790. In lecture, this was tied to the **Supremacy Clause**.", "**3. Congressional legislation.** Fairly uncommon. Only **182** acts of Congress have been declared unconstitutional in the country's entire history.", "**4. Executive orders.**", "Said in class: know the ranking, not the exact counts."], "q": [{"k": "order", "q": "Rank the targets of judicial review from most common to least common.", "items": ["Rules made by executive departments and agencies", "State legislation", "Congressional legislation", "Executive orders"]}, {"k": "fill", "q": "Agency rules are reviewed most often because Congress legislates in _____ terms and leaves the details to the agencies.", "a": ["general", "broad"]}, {"k": "tf", "q": "Courts strike down state laws more often than acts of Congress.", "a": true, "why": "About 1,335 state laws and provisions since 1790, against 182 acts of Congress."}, {"k": "fill", "q": "Judicial review of state laws rests on the _____ Clause of Article VI.", "a": ["Supremacy"]}]}, {"id": "scotus-jurisdiction", "t": "SCOTUS: original vs appellate jurisdiction", "src": "Lectures 13–14", "core": ["**Original:** state against state, ambassadors (rare). **Appellate:** from the courts of appeals and state supreme courts (nearly everything)."], "read": ["The Supreme Court has both.", "**Appellate jurisdiction** (nearly everything): cases from the **U.S. courts of appeals**, or from the **highest court of a state** when a federal question is at issue.", "**Original jurisdiction** (the Court hears the case first): **disputes between states**, and disputes involving **ambassadors** and other high-ranking ministers. The Court uses it **less than once a year** on average."], "trap": ["From the TA's review game: most cases reaching the Supreme Court come from the **U.S. courts of appeals** and **state supreme courts**. Not straight from a district court."], "q": [{"k": "fill", "q": "A lawsuit between two states goes straight to the Supreme Court under its _____ jurisdiction.", "a": ["original"]}, {"k": "sort", "q": "Original or appellate jurisdiction?", "buckets": ["Original jurisdiction", "Appellate jurisdiction"], "items": [["A dispute between two states", 0], ["A case involving an ambassador", 0], ["Used less than once a year", 0], ["An appeal from a U.S. court of appeals", 1], ["A federal question decided by a state's highest court", 1], ["Covers nearly all of the Court's cases", 1]]}, {"k": "tf", "q": "Most of the Supreme Court's cases arrive under its original jurisdiction.", "a": false, "why": "Original jurisdiction is used less than once a year. Nearly everything is appellate."}, {"k": "tf", "q": "The Supreme Court can review a decision of a state's highest court when a federal question is at issue.", "a": true, "why": "That's one of the two sources of its appellate cases."}]}, {"id": "jefferson-review", "t": "Jefferson's criticism of judicial review", "src": "Lecture 14", "core": ["He agreed unconstitutional laws are invalid but rejected **judicial supremacy**, the Court's monopoly on interpretation. Judges are “as honest as other men, and not more so.”"], "read": ["Jefferson (1820) **agreed** that a law that contravenes the Constitution is invalid.", "What he **rejected** was **judicial supremacy**: the idea that the Supreme Court has a **monopoly on constitutional interpretation**.", "His reason: judges are “**as honest as other men, and not more so**.” “They have, with others, the same passions for party, for power, and the privilege of their corps.”"], "q": [{"k": "sort", "q": "Jefferson or Hamilton?", "buckets": ["Jefferson", "Hamilton"], "items": [["Judges have the same passions for party and power as anyone else", 0], ["Each branch may interpret the Constitution for itself", 0], ["Judges should serve fixed, renewable terms", 0], ["Impeachment does nothing to restrain judges", 0], ["The courts are the least dangerous branch", 1], ["Permanent tenure is what keeps judges independent", 1], ["The courts stand between the people and the legislature to protect rights", 1]]}, {"k": "fill", "q": "Jefferson rejected judicial _____, the idea that the Supreme Court has a monopoly on interpreting the Constitution.", "a": ["supremacy"]}, {"k": "tf", "q": "Jefferson agreed that a law that contravenes the Constitution is invalid.", "a": true, "why": "His quarrel was over who decides, not over whether such a law is invalid."}, {"k": "fill", "q": "Jefferson wrote that judges are “as _____ as other men, and not more so.”", "a": ["honest"]}]}, {"id": "departmental", "t": "Departmental theory of constitutional interpretation", "src": "Lecture 14", "core": ["**Each branch** interprets the Constitution for itself."], "read": ["Jefferson's alternative to judicial supremacy. **Each department** of government (executive, legislative, and judicial) is entitled to **interpret the Constitution for itself**.", "The slide's example: a president refuses to enforce a law of Congress because he deems it unconstitutional."], "q": [{"k": "fill", "q": "The view that each branch of government may interpret the Constitution for itself is called the _____ theory.", "a": ["departmental", "departmentalist", "departmentalism"]}, {"k": "open", "q": "State the departmental theory and give an example of it in action.", "a": "Each department (executive, legislative, judicial) is entitled to interpret the Constitution for itself.\nExample: a president refuses to enforce a law he considers unconstitutional."}, {"k": "tf", "q": "The departmental theory holds that only the judicial department may interpret the Constitution.", "a": false, "why": "That's judicial supremacy, the view Jefferson rejected. Under the departmental theory every branch interprets for itself."}]}, {"id": "jefferson-tenure", "t": "Jefferson's criticism of judicial life tenure", "src": "Lecture 14", "core": ["He wanted **six-year** renewable terms. Impeachment is a “**bugbear**” that judges don't fear."], "read": ["Jefferson (1820): federal judges should be appointed for **six-year** terms, “with a re-appointmentability by the president with the approbation of **both houses**.”", "**Impeachment alone won't limit judicial power.** Judges' “perversions of the Constitution” are excused as “errors of judgment.” “Impeachment therefore is a **bugbear** which they fear not at all.”", "A regular review would work better: judges “would be under some awe of the canvas of their conduct which would be open to both houses regularly every sixth year.”"], "q": [{"k": "fill", "q": "Jefferson proposed that federal judges serve renewable terms of _____ years.", "a": ["6", "six"]}, {"k": "fill", "q": "Jefferson called impeachment “a _____ which they fear not at all.”", "a": ["bugbear"]}, {"k": "pick", "q": "Which of these are Jefferson's positions on judicial tenure? Pick all that apply.", "opts": [["Judges should serve fixed terms and face reappointment", true], ["Reappointment should take the president and both houses of Congress", true], ["Impeachment alone will not restrain judges", true], ["Permanent tenure keeps judges independent", false], ["Judges should be elected by the voters", false], ["Short terms would keep the best lawyers off the bench", false]]}, {"k": "tf", "q": "Jefferson wanted judges reappointed by the president alone, with no role for Congress.", "a": false, "why": "Reappointment by the president “with the approbation of both houses.”"}]}, {"id": "hamilton-review", "t": "Hamilton's arguments for judicial review", "src": "Lecture 14 (finishing Mon 10/12)", "core": ["**Federalist 78.** The courts are the “**least dangerous branch**”: no **purse** and no **sword**.", "They are an **intermediate body** that protects rights. Judicial review shows the superiority of the **people**, not of judges."], "read": ["**Federalist No. 78 (1788), Alexander Hamilton.** The courts are the “**least dangerous branch**”: they “lack access to both the **purse** of the legislative branch and the **sword** of the executive branch.”", "The objection he answers: judicial review “would imply a superiority of the judiciary to the legislative power.”", "**Reply 1:** the courts are an “**intermediate body**” between the people and the legislature, needed to protect rights. Guarding the Constitution against legislative encroachment can only be done through the courts. “Without this, all the reservations of particular rights or privileges would amount to nothing.”", "**Reply 2:** judicial review implies the **superiority of the people**, not “superiority of the judicial to the legislative power.”"], "q": [{"k": "open", "q": "Why does Hamilton call the judiciary the “least dangerous” branch?", "a": "It has neither the purse (which the legislature holds) nor the sword (which the executive holds)."}, {"k": "open", "q": "How does Hamilton answer the objection that judicial review makes the judiciary superior to the legislature?", "a": "The courts are an intermediate body between the people and the legislature, needed to protect rights; without them, reserved rights would amount to nothing.\nJudicial review implies the superiority of the people, not of judges over legislators."}, {"k": "fill", "q": "Hamilton defended judicial review and life tenure in Federalist No. _____.", "a": ["78", "seventy-eight", "seventy eight"]}, {"k": "fill", "q": "Hamilton said the courts are the least dangerous branch because they have neither the sword nor the _____.", "a": ["purse"]}, {"k": "fill", "q": "For Hamilton, judicial review implies the superiority of the _____, not of the judges over the legislature.", "a": ["people"]}, {"k": "tf", "q": "Hamilton called the judiciary the most dangerous branch because its judges serve for life.", "a": false, "why": "He called it the least dangerous branch: no purse and no sword."}]}, {"id": "hamilton-tenure", "t": "Hamilton's three arguments for life tenure", "src": "Lecture 14 slides (taught Mon 10/12)", "core": ["**Independence:** permanent tenure frees judges from pleasing whoever would reappoint them. **Qualifications:** few have the skill and integrity, and short terms would keep them away.", "The study guide says three arguments. Get the third from the Monday review."], "read": ["**1. The independence argument.** An “inflexible and uniform” adherence to the rights of the Constitution can't be expected from judges who “hold their offices by a temporary commission.” If the **executive or the legislature** reappointed them, there would be “an improper complaisance” to that branch. If **both** did, judges would be unwilling to displease either. If the **people** did, there would be “too great a disposition to consult **popularity**.” “Nothing can contribute so much to its firmness and independence as **permanency in office**.”", "**2. The qualifications argument.** Few people have “sufficient skill in the laws” to be judges, and fewer still combine “the requisite **integrity** with the requisite **knowledge**.” A temporary term would discourage them “from quitting a lucrative line of practice,” leaving justice in hands “less able, and less well qualified.”", "**Heads-up:** the study guide says *three* arguments, and the posted slides show these two. In the reading itself, independence has two sides: independence from the *other branches* (the judiciary is the weakest and in “continual jeopardy of being overpowered”) and independence from the *people's* “occasional **ill humors**,” which protects individual and minority rights. Listen for how the professor counts them in the Mon 10/12 review."], "q": [{"k": "open", "q": "Give Hamilton's arguments for life tenure, as far as the slides go.", "a": "Independence: judges with temporary commissions would defer to whoever reappoints them (executive, legislature, or the people); permanency in office gives firmness.\nQualifications: few have both the legal skill and the integrity; short terms would keep the best lawyers from leaving practice.\n(The guide says three. Check Monday's lecture for the third.)"}, {"k": "fill", "q": "Hamilton: “nothing can contribute so much to its firmness and independence as _____ in office.”", "a": ["permanency", "permanence"]}, {"k": "tf", "q": "Hamilton's qualifications argument is that short terms would draw more of the best lawyers onto the bench.", "a": false, "why": "The reverse: temporary terms would discourage skilled lawyers from leaving a lucrative practice."}, {"k": "fill", "q": "Hamilton warned that judges who depended on the people for reappointment would show “too great a disposition to consult _____.”", "a": ["popularity"]}]}, {"id": "originalism", "t": "Originalism vs Living Constitutionalism: arguments for and against", "src": "Lecture 14 slides (taught Mon 10/12)", "core": ["**Originalism:** the meaning is fixed as it was understood when written. **Living constitutionalism:** the meaning evolves with society.", "Against originalism: it ties us to outdated values. Against living constitutionalism: judges read in what they want, and changing the text is what amendments are for."], "read": ["**Originalism:** a theory of constitutional interpretation that aims to follow how the Constitution **would have been understood at the time it was written**. Originalists argue the meaning of the text is **fixed**, not adaptable to current circumstances.", "**Living constitutionalism:** a theory that views the Constitution as having a **dynamic meaning**, even if the document is not formally amended. It evolves, changes over time, and adapts to new circumstances. Each generation understands things differently: “**cruel and unusual**” means something different today.", "**Arguments against originalism:** it binds modern society to **outdated values** and ignores evolving social realities. And the Constitution is **silent** on how it should be interpreted.", "**Arguments against living constitutionalism:** it makes the law say what is **desired**, not what it actually says (it is accused of “**reading rights**” into the Constitution). And since the framers provided a way to **amend** the Constitution, they never intended their words to change meaning.", "The arguments *for* each are the mirror image: the case against one is the case for the other.", "From the assigned video: Justice **Scalia** argues the originalist side; Justice **Breyer** the living, pragmatic side."], "q": [{"k": "sort", "q": "Originalism or living constitutionalism?", "buckets": ["Originalism", "Living constitutionalism"], "items": [["The meaning is fixed at the time the text was written", 0], ["Read the text as the founding generation understood it", 0], ["Associated with Justice Scalia", 0], ["The meaning evolves as society changes", 1], ["“Cruel and unusual” means something different today", 1], ["Associated with Justice Breyer", 1]]}, {"k": "sort", "q": "Which theory is each criticism aimed at?", "buckets": ["Criticism of originalism", "Criticism of living constitutionalism"], "items": [["It binds modern society to outdated values", 0], ["It ignores evolving social realities", 0], ["The Constitution is silent on how it should be interpreted", 0], ["It makes the law say what is desired", 1], ["It reads rights into the Constitution", 1], ["The framers provided an amendment process for change", 1]]}, {"k": "fill", "q": "The theory that the Constitution's meaning was fixed at the time it was written is called _____.", "a": ["originalism"]}, {"k": "fill", "q": "The theory that the Constitution's meaning evolves even without formal amendment is called _____ constitutionalism.", "a": ["living"]}, {"k": "tf", "q": "“It reads rights into the Constitution” is a standard criticism of originalism.", "a": false, "why": "That's the charge against living constitutionalism. Originalism is criticized for binding society to outdated values."}, {"k": "tf", "q": "The existence of an amendment process is used as an argument against living constitutionalism.", "a": true, "why": "The framers provided a way to amend the text, so, the argument goes, they never intended its words to change meaning on their own."}]}]}], "blocks": [{"id": "I-A", "sec": "I", "title": "Thinkers and the road to 1776", "items": ["aristotle", "romans", "locke", "montesquieu", "revwar", "second-cc"]}, {"id": "I-B", "sec": "I", "title": "The Articles and the Convention", "items": ["articles", "convention-events", "va-nj", "compromises", "fed-antifed"]}, {"id": "I-C", "sec": "I", "title": "Madison: Federalist 51 and 10", "items": ["sep-checks", "bicameralism", "fed51", "fed10"]}, {"id": "I-D", "sec": "I", "title": "The Anti-Federalists and the settlement", "items": ["brutus", "storing", "bill-of-rights", "checks-chart", "amending"]}, {"id": "II-A", "sec": "II", "title": "Systems and types of power", "items": ["systems", "power-types", "nat-state", "concurrent", "reserved"]}, {"id": "II-B", "sec": "II", "title": "Limits on states, the Article IV clauses, the 1930s shift", "items": ["denied", "guarantee", "interstate", "dual-coop"]}, {"id": "III-A", "sec": "III", "title": "Members, leaders, and models of representation", "items": ["qualifications", "terms", "speaker", "senate-president", "models"]}, {"id": "III-B", "sec": "III", "title": "How a bill becomes law; districts; the Senate's design", "items": ["leg-process", "redistricting", "fed63", "amend17"]}, {"id": "IV-A", "sec": "IV", "title": "Presidential powers and the war-powers fight", "items": ["pres-powers", "declare-war", "unitary", "wpr"]}, {"id": "IV-B", "sec": "IV", "title": "Emergency power and removal", "items": ["prerogative", "lincoln", "impeachment", "trump-impeach", "amend25"]}, {"id": "V-A", "sec": "V", "title": "Judicial review and the court system", "items": ["judicial-review", "supremacy", "jurisdiction", "structure", "court-differences"]}, {"id": "V-B", "sec": "V", "title": "The Supreme Court at work", "items": ["cert", "tenure", "scope", "scotus-jurisdiction"]}, {"id": "V-C", "sec": "V", "title": "Jefferson vs Hamilton; how to read the Constitution", "items": ["jefferson-review", "departmental", "jefferson-tenure", "hamilton-review", "hamilton-tenure", "originalism"]}], "plan": [{"when": "Three days out", "what": "First pass. Work through the blocks in order: read a block, hide it, recall it. Get as far as the end of **III · Congress**."}, {"when": "Two days out", "what": "Finish **IV · Presidency** and **V · Judiciary** (do block V-C after the review lecture). Then run **Redo misses** until it's empty."}, {"when": "The day before", "what": "Two **mixed drills**, then **Redo misses** again. Skim every “Watch out” box once. Stop early and sleep."}], "how": ["**Read** a block: the must-know lines for five or so study-guide items. Open the detail behind any line that doesn't make sense yet.", "**Hide it and recall.** Most questions are a click or a single word, and they're checked for you. A few ask you to explain an idea: say it or type it, then compare with the model answer and grade yourself.", "**Come back.** Anything you miss goes into **Redo misses**. Clearing that list on a later day is what makes it stick."], "detail": ["romans.3", "locke.2", "locke.4", "revwar.1", "revwar.2", "revwar.3", "revwar.5", "second-cc.3", "bicameralism.3", "fed51.2", "fed51.3", "bill-of-rights.2", "systems.3", "systems.4", "reserved.2", "dual-coop.4", "leg-process.8", "redistricting.2", "redistricting.3", "fed63.2", "declare-war.3", "unitary.5", "impeachment.4", "amend25.4", "court-differences.2", "tenure.1", "scope.3", "jefferson-tenure.3", "hamilton-tenure.3"]}</script>
<script>
const D = JSON.parse(document.getElementById('data').textContent);
const $ = (s, r = document) => r.querySelector(s);
const app = $('#app');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const md = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\*(.+?)\*/g, '<i>$1</i>');

/* ---------- index ---------- */
const SEC = {}, ITEMS = {}, QS = {}, BL = {};
D.sections.forEach(s => { SEC[s.id] = s; s.items.forEach(it => { it.sec = s.id; ITEMS[it.id] = it; it.q.forEach((q, i) => { q.id = it.id + '.' + i; q.item = it.id; QS[q.id] = q; }); }); });
D.blocks.forEach(b => { BL[b.id] = b; b.qs = b.items.flatMap(id => ITEMS[id].q.map(q => q.id)); b.items.forEach(id => ITEMS[id].block = b.id); });
const DETAIL = new Set(D.detail || []);
Object.values(QS).forEach(q => { q.detail = DETAIL.has(q.id); });
const EVERYQ = Object.keys(QS);

/* ---------- progress ---------- */
const SANDBOX = new URLSearchParams(location.search).has('test');   // ?test = scratch copy for trying things out
const KEY = SANDBOX ? 'poli100-study-test' : 'poli100-study-v1';
const blank = () => ({v: 1, q: {}, notes: {}, flags: {}, blocks: {}, sess: null, ui: {mode: 'core'}});
let P;
try { P = Object.assign(blank(), JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) { P = blank(); }
